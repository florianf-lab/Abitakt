# abitakt – Netlify configuration
[build]
  publish = "."
  # no build step: the app is a single index.html

[build.environment]
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"   # tests only run locally, not on Netlify
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The service worker must never be cached by the browser, otherwise updates get stuck.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Test and tooling files are not part of the app.
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
