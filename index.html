<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>abitakt — Abitur Baden-Württemberg</title>
<style>
/* ============================================================
   ABITAKT DESIGN SYSTEM
   Principle: one decision per screen. Nothing on screen that
   the user is not being asked to attend to right now.
   ============================================================ */
:root{
  --bg:#08090e;
  --bg-grad:radial-gradient(1200px 700px at 20% -10%, #16182a 0%, #08090e 55%);
  --surface:#101219;
  --surface-2:#161923;
  --surface-3:#1d2130;
  --line:rgba(255,255,255,.075);
  --line-strong:rgba(255,255,255,.14);
  --tx:#e9ebf3;
  --tx-dim:#a2a8bd;
  --tx-mute:#6c7387;
  --accent:#7d6cf6;
  --accent-soft:rgba(125,108,246,.14);
  --accent-line:rgba(125,108,246,.42);
  --teal:#35d6c0;
  --teal-soft:rgba(53,214,192,.13);
  --amber:#f2b179;
  --rose:#f2789a;
  --green:#6fe08c;
  --r-sm:10px; --r:16px; --r-lg:24px; --r-xl:32px;
  --ease:cubic-bezier(.16,1,.3,1);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;
  color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
::selection{background:var(--accent-soft);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#252938;border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#33384b;background-clip:content-box;border:3px solid transparent}

/* ---------- Typography ---------- */
h1,h2,h3{letter-spacing:-.022em;line-height:1.18;font-weight:640}
h1{font-size:clamp(28px,4.2vw,42px)}
h2{font-size:clamp(21px,2.6vw,27px)}
h3{font-size:17px;font-weight:600}
.eyebrow{font-size:11px;font-weight:640;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-mute)}
.lede{color:var(--tx-dim);font-size:16.5px;max-width:60ch}
.dim{color:var(--tx-dim)} .mute{color:var(--tx-mute)} .mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Layout ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.screen{display:none;flex:1;animation:enter .42s var(--ease) both}
.screen.on{display:flex;flex-direction:column}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.994)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.9)}60%{transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}
.center-wrap{flex:1;display:grid;place-items:center;padding:48px 24px}
.stage{width:100%;max-width:620px}
.stage-wide{width:100%;max-width:1180px;margin:0 auto;padding:0 24px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 26px;border-radius:999px;font-size:15px;font-weight:600;
  letter-spacing:-.005em;transition:all .22s var(--ease);white-space:nowrap;
}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 24px -8px rgba(125,108,246,.75)}
.btn-primary:hover{background:#8b7bf8;transform:translateY(-1.5px);box-shadow:0 12px 30px -8px rgba(125,108,246,.85)}
.btn-primary:active{transform:translateY(0) scale(.985)}
.btn-ghost{border:1px solid var(--line-strong);color:var(--tx-dim);background:rgba(255,255,255,.015)}
.btn-ghost:hover{border-color:var(--accent-line);color:var(--tx);background:var(--accent-soft)}
.btn-quiet{color:var(--tx-mute);padding:10px 14px;font-size:14px;font-weight:500}
.btn-quiet:hover{color:var(--tx)}
.btn:disabled{opacity:.34;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn-lg{padding:16px 34px;font-size:16px}
.btn-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:28px}

/* ---------- Cards & surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px}
.card-2{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.012));backdrop-filter:blur(14px)}

/* ---------- Progress rail (onboarding) ---------- */
.rail{position:fixed;top:0;left:0;right:0;height:2px;background:rgba(255,255,255,.05);z-index:60}
.rail-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--teal));transition:width .55s var(--ease);box-shadow:0 0 12px rgba(125,108,246,.6)}
.step-label{position:fixed;top:20px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tx-mute);z-index:60;font-weight:640}

/* ---------- Option lists ---------- */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);transition:all .18s var(--ease);font-size:15.5px;line-height:1.4;
}
.opt:hover{border-color:var(--line-strong);background:var(--surface-2);transform:translateX(3px)}
.opt.sel{border-color:var(--accent-line);background:var(--accent-soft)}
.opt.correct{border-color:rgba(111,224,140,.55);background:rgba(111,224,140,.1)}
.opt.wrong{border-color:rgba(242,120,154,.5);background:rgba(242,120,154,.09)}
.opt-key{
  flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:rgba(255,255,255,.05);font-size:12px;font-weight:660;color:var(--tx-mute);
  font-family:var(--mono);transition:all .18s var(--ease)
}
.opt.sel .opt-key{background:var(--accent);color:#fff}
.opt.correct .opt-key{background:var(--green);color:#06210d}
.opt.wrong .opt-key{background:var(--rose);color:#3a0715}

/* ---------- Chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
.chip{
  padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:14px;transition:all .18s var(--ease);color:var(--tx-dim)
}
.chip:hover{border-color:var(--line-strong);color:var(--tx);transform:translateY(-1px)}
.chip.sel{background:var(--accent-soft);border-color:var(--accent-line);color:#fff}
.chip-sm{padding:5px 11px;font-size:12px;font-weight:600}

/* ---------- Inputs ---------- */
.field{width:100%;padding:14px 17px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);font-size:15.5px;transition:all .2s var(--ease);outline:none}
.field:focus{border-color:var(--accent-line);background:var(--surface-2);box-shadow:0 0 0 4px rgba(125,108,246,.1)}
.field::placeholder{color:var(--tx-mute)}
textarea.field{min-height:150px;resize:vertical;line-height:1.6;font-family:var(--mono);font-size:13.5px}
.label{display:block;font-size:13px;font-weight:600;color:var(--tx-dim);margin:22px 0 9px}

/* ---------- Assessment specifics ---------- */
.timer-ring{position:relative;width:44px;height:44px}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:660;font-family:var(--mono)}
.assess-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
.q-num{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx-mute);font-weight:640}
.q-text{font-size:21px;line-height:1.42;font-weight:560;letter-spacing:-.012em}
.seq{display:flex;gap:11px;flex-wrap:wrap;margin:26px 0 4px;align-items:center}
.seq-cell{
  min-width:60px;height:60px;padding:0 12px;border-radius:14px;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:21px;font-weight:640;
  font-family:var(--mono);animation:popIn .3s var(--ease) both
}
.seq-cell.q{border:1px dashed var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.speed-pair{display:flex;gap:20px;justify-content:center;align-items:center;margin:34px 0}
.speed-box{min-width:130px;padding:30px 22px;border-radius:20px;background:var(--surface-2);
  border:1px solid var(--line);text-align:center;font-size:30px;font-weight:680;font-family:var(--mono)}
.memo-grid{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;margin:30px 0}
.memo-cell{height:64px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);
  transition:all .2s var(--ease);display:grid;place-items:center;font-size:20px;font-weight:660}
.memo-cell.lit{background:var(--accent);border-color:var(--accent);box-shadow:0 0 26px rgba(125,108,246,.6);transform:scale(1.06)}
.memo-cell.picked{background:var(--surface-3);border-color:var(--accent-line)}
.digits{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:.16em;text-align:center;
  margin:38px 0;color:var(--accent);animation:fadeIn .2s}

/* ---------- Energy grid ---------- */
.energy-grid{display:flex;flex-direction:column;gap:8px;margin-top:24px}
.energy-row{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:14px}
.energy-row-label{font-size:13px;color:var(--tx-dim);font-weight:560}
.energy-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ebtn{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  font-size:12px;font-weight:600;color:var(--tx-mute);transition:all .16s var(--ease)}
.ebtn:hover{border-color:var(--line-strong);color:var(--tx)}
.ebtn.sel{color:#fff;border-color:transparent}
.ebtn.sel[data-v="1"]{background:#3a3f52}
.ebtn.sel[data-v="2"]{background:#4c4a7a}
.ebtn.sel[data-v="3"]{background:#5f56a8}
.ebtn.sel[data-v="4"]{background:#7263d4}
.ebtn.sel[data-v="5"]{background:var(--accent);box-shadow:0 0 18px rgba(125,108,246,.5)}

/* ---------- App chrome (post-onboarding) ---------- */
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:16px 26px;border-bottom:1px solid var(--line);
  background:rgba(8,9,14,.78);backdrop-filter:blur(20px) saturate(180%)
}
.brand{display:flex;align-items:center;gap:11px;font-weight:680;letter-spacing:-.02em;font-size:16px}
.brand-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(140deg,var(--accent),var(--teal));
  display:grid;place-items:center;font-size:13px;font-weight:800;color:#0a0b12}
.nav{display:flex;gap:3px}
.nav button{padding:8px 15px;border-radius:999px;font-size:13.5px;font-weight:560;color:var(--tx-mute);transition:all .18s var(--ease)}
.nav button:hover{color:var(--tx);background:rgba(255,255,255,.04)}
.nav button.on{color:#fff;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.topbar-right{display:flex;align-items:center;gap:16px}
.streak{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:660;color:var(--amber)}

/* ---------- Dashboard ---------- */
.dash{padding:34px 0 90px}
.dash-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:30px}
.grid{display:grid;gap:16px}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2-1{grid-template-columns:1.62fr 1fr}
@media(max-width:960px){.g-3,.g-2-1{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.stat-k{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx-mute);font-weight:640}
.stat-v{font-size:33px;font-weight:700;letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums}
.stat-sub{font-size:13px;color:var(--tx-dim);margin-top:3px}

/* task cards */
.task{
  display:flex;align-items:center;gap:16px;padding:17px 19px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface-2);transition:all .2s var(--ease);cursor:pointer;
  text-align:left;width:100%
}
.task:hover{border-color:var(--accent-line);transform:translateX(4px);background:var(--surface-3)}
.task.done{opacity:.42}
.task.done .task-title{text-decoration:line-through}
.task-time{font-family:var(--mono);font-size:12.5px;color:var(--tx-mute);flex:none;width:52px;font-weight:600}
.task-body{flex:1;min-width:0}
.task-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
.task-meta{font-size:12.5px;color:var(--tx-mute);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.load-dots{display:inline-flex;gap:2.5px}
.load-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.14)}
.load-dot.on{background:var(--accent)}
.pill{padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:680;letter-spacing:.05em;text-transform:uppercase}
.pill-peak{background:var(--accent-soft);color:#a99cff;box-shadow:inset 0 0 0 1px var(--accent-line)}
.pill-low{background:rgba(255,255,255,.045);color:var(--tx-mute)}
.pill-exam{background:rgba(242,120,154,.14);color:var(--rose)}
.pill-teal{background:var(--teal-soft);color:var(--teal)}

/* bars & rings */
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--teal));transition:width .9s var(--ease)}
.mastery-row{display:flex;align-items:center;gap:14px;padding:11px 0}
.mastery-name{flex:none;width:132px;font-size:14px;font-weight:560}
.mastery-pct{flex:none;width:42px;text-align:right;font-size:13px;font-family:var(--mono);color:var(--tx-dim);font-weight:600}

/* energy strip */
.estrip{display:flex;gap:3px;height:56px;align-items:flex-end;margin-top:6px}
.ebar{flex:1;border-radius:4px 4px 2px 2px;background:var(--surface-3);transition:all .5s var(--ease);position:relative}
.ebar.now{box-shadow:0 0 0 1.5px var(--teal)}
.estrip-x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--tx-mute);margin-top:7px;font-family:var(--mono)}

/* ---------- Focus / session player ---------- */
.focus-screen{background:#06070b}
.focus-top{display:flex;align-items:center;justify-content:space-between;padding:18px 26px}
.step-pips{display:flex;gap:5px}
.pip{width:26px;height:3px;border-radius:99px;background:rgba(255,255,255,.11);transition:all .4s var(--ease)}
.pip.on{background:var(--accent);box-shadow:0 0 9px rgba(125,108,246,.7)}
.pip.done{background:rgba(125,108,246,.42)}
.focus-body{flex:1;display:grid;place-items:center;padding:20px 24px 60px}
.focus-card{width:100%;max-width:660px;animation:enter .4s var(--ease) both}
.micro-tag{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);font-size:11.5px;font-weight:640;
  letter-spacing:.06em;text-transform:uppercase;color:var(--tx-dim);margin-bottom:20px}
.teach{font-size:17.5px;line-height:1.68;color:#dfe2ee}
.teach p{margin-bottom:15px}
.teach strong{color:#fff;font-weight:640}
.teach em{color:var(--teal);font-style:normal;font-weight:560}
.visual-box{margin:22px 0;padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.kinetic-box{margin:22px 0;padding:22px;border-radius:var(--r);background:linear-gradient(150deg,var(--teal-soft),transparent);
  border:1px solid rgba(53,214,192,.24)}
.audio-box{margin:22px 0;padding:20px 22px;border-radius:var(--r);background:var(--surface);
  border-left:3px solid var(--amber)}
.reward{
  position:fixed;bottom:34px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  padding:14px 24px;border-radius:999px;background:var(--surface-3);border:1px solid var(--accent-line);
  box-shadow:0 16px 44px -12px rgba(0,0,0,.9),0 0 30px -8px rgba(125,108,246,.5);
  display:flex;align-items:center;gap:11px;font-size:14.5px;font-weight:600;z-index:100;
  transition:all .5s var(--ease);pointer-events:none
}
.reward.show{opacity:1;transform:translateX(-50%) translateY(0)}
.reward-xp{color:var(--teal);font-family:var(--mono);font-weight:700}

/* ---------- Misc ---------- */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.sec-title{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx-mute);font-weight:680}
.divider{height:1px;background:var(--line);margin:26px 0}
.kv{display:flex;justify-content:space-between;padding:9px 0;font-size:14px;border-bottom:1px solid var(--line)}
.kv:last-child{border:none}
.kv-k{color:var(--tx-mute)}
.kv-v{font-weight:600}
.empty{text-align:center;padding:44px 20px;color:var(--tx-mute);font-size:14.5px}
.hint{font-size:13px;color:var(--tx-mute);margin-top:12px;line-height:1.55}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:640px){
  .nav button{padding:8px 11px;font-size:12.5px}
  .topbar{padding:13px 16px}
  .stage-wide{padding:0 16px}
  .mastery-name{width:98px}
  .speed-pair{flex-direction:column;gap:14px}
}
.langbar{position:fixed;top:14px;left:16px;z-index:70;display:flex;gap:3px;
  padding:3px;border-radius:999px;background:rgba(16,18,25,.82);backdrop-filter:blur(14px);
  border:1px solid var(--line)}
.langbtn{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;
  color:var(--tx-mute);transition:all .18s var(--ease)}
.langbtn:hover{color:var(--tx)}
.langbtn.on{background:var(--accent);color:#fff}
.topbar{padding-left:150px}
@media(max-width:640px){.langbar{top:10px;left:10px}.topbar{padding-left:132px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
:is(button,a,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 5px var(--line-strong)}
</style>
</head>
<body>
<main id="app"></main>
<div class="reward" id="reward"><span id="reward-txt"></span></div>
<script>
"use strict";
/* ============================================================
   KAIROS — adaptive learning prototype
   Sections: 1 Store · 2 Util · 3 Content · 4 Engine · 5 Screens · 6 Router
   ============================================================ */

/* ---------- 1. STORE ------------------------------------- */
const BLANK = () => ({
  v: 1,
  lang: null,
  name: "",
  stage: "welcome",
  cog: { pattern: null, logic: null, speed: null, memory: null, composite: null },
  style: { visual: 0, auditory: 0, kinesthetic: 0, textual: 0 },
  attention: { span: 22, overwhelm: 3, restart: 3, novelty: 3 },
  person: { interests: [], goals: [], humor: "warm" },
  energy: {},                 // hourBlock -> 1..5
  subjects: [],               // {id,name,topics:[{id,name,mastery,exam,attempts}]}
  progress: {},               // topicId -> {mastery, attempts, correct, avgMs, modalityScore:{}}
  session: null,
  xp: 0, level: 1, streak: 1,
  lastActive: null,
  log: [],                    // {t, topicId, correct, ms, difficulty}
  rewardState: { sinceLast: 0, lastKind: null },
  completedToday: []
});

let S = BLANK();
const KEY = "abitakt.v1";

const Store = {
  save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* file:// or private mode */ }
  },
  load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return false;
      const d = JSON.parse(raw);
      if (d && d.v === 1) { S = Object.assign(BLANK(), d); return true; }
    } catch (e) {}
    return false;
  },
  reset() { try { localStorage.removeItem(KEY); } catch (e) {} S = BLANK(); },
  export() {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "kairos-profile.json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
};

/* ---------- 2. UTIL -------------------------------------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const app = () => document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pct = v => Math.round(clamp(v, 0, 1) * 100);
const uid = () => Math.random().toString(36).slice(2, 9);
const pick = a => a[Math.floor(Math.random() * a.length)];
const sum = a => a.reduce((x, y) => x + y, 0);
const mean = a => (a.length ? sum(a) / a.length : 0);
const sigmoid = x => 1 / (1 + Math.exp(-x));

function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}
function daysUntil(iso) {
  if (!iso) return null;
  const d = (new Date(iso + "T00:00:00") - new Date(new Date().toDateString())) / 864e5;
  return Math.round(d);
}
function hourLabel(h) {
  if (LANG === "en") { const ap = h < 12 ? "am" : "pm"; return (h % 12 === 0 ? 12 : h % 12) + ap; }
  return String(h).padStart(2, "0") + ":00";
}
/* delegated click handling: every interactive element declares data-act */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, el.dataset); }
});
const ACT = {};

/* reward toast */
let rewardTimer = null;
function toast(msg, ms) {
  const r = document.getElementById("reward");
  document.getElementById("reward-txt").innerHTML = msg;
  r.classList.add("show");
  clearTimeout(rewardTimer);
  rewardTimer = setTimeout(() => r.classList.remove("show"), ms || 2600);
}

let LANG = "de";
/* t("key", {n: 3}) — falls back to German, then to the key itself, so a
   missing translation degrades visibly rather than rendering "undefined". */
function t(key, vars) {
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N.de[key] || key;
  if (vars) Object.keys(vars).forEach(k => { s = s.split("{" + k + "}").join(vars[k]); });
  return s;
}
function setLang(code) {
  if (!I18N[code]) return;
  LANG = code;
  S.lang = code;
  document.documentElement.lang = code;
  Store.save();
}
function langSwitcher() {
  return '<div class="langbar" role="group" aria-label="Language / Sprache / Dil">' + LANGS.map(([c, label]) =>
    '<button type="button" class="langbtn ' + (LANG === c ? "on" : "") + '" aria-pressed="' + (LANG === c) + '" aria-label="' + esc(label) + '" data-act="setLang" data-v="' + c +
    '" title="' + esc(label) + '">' + c.toUpperCase() + "</button>").join("") + "</div>";
}

        kinesthetic: `<div class="kinetic-box"><p style="margin:0"><strong>Erst du.</strong> Lies den Satz und benenne beide Bedingungen, bevor du weiterliest:</p>

      { t: "Das Ruhepotential",
        visual: `<p>Eine Nervenzelle ist im Ruhezustand nicht neutral. Sie ist geladen – wie eine gespannte Feder.</p>

          <rect x="14" y="46" width="272" height="16" rx="4" fill="rgba(255,255,255,.07)"/>

          <p>Innen negativ, außen positiv. Diese Spannung von etwa <strong>−70 mV</strong> heißt <em>Ruhepotential</em> und wird aktiv aufrechterhalten.</p>`,
        auditory: `<p>Ein Satz, der den ganzen Schritt trägt:</p>

          <p>Zwei Ursachen, laut mitsprechen: Erstens die <strong>Natrium-Kalium-Pumpe</strong>, die unter ATP-Verbrauch drei Na⁺ hinaus und zwei K⁺ hinein befördert – drei raus, zwei rein, macht netto eine positive Ladung weniger innen.</p>
          <p>Zweitens die <strong>Kalium-Leckkanäle</strong>: die Membran ist im Ruhezustand vor allem für K⁺ durchlässig, K⁺ strömt dem Konzentrationsgefälle folgend hinaus und nimmt positive Ladung mit.</p>`,
        kinesthetic: `<div class="kinetic-box"><p style="margin:0"><strong>Zähl kurz nach.</strong> Die Pumpe schafft 3 Na⁺ nach außen und 2 K⁺ nach innen. Wie verändert ein Pumpzyklus die Ladung im Inneren?</p></div>
          <p>Drei positive raus, zwei positive rein – netto wird das Innere pro Zyklus um <strong>eine positive Ladung ärmer</strong>, also negativer.</p>
          <p>Wichtig fürs Abitur: Die Pumpe arbeitet <em>gegen</em> das Konzentrationsgefälle und braucht deshalb <strong>ATP</strong>. Wird die ATP-Versorgung blockiert, bricht das Ruhepotential langsam zusammen – eine beliebte Prüfungsfrage.</p>`,
        textual: `<p><strong>Ruhepotential:</strong> ca. −70 mV (Zellinneres gegenüber Außenmedium).</p>
          <p><strong>Zustandekommen:</strong></p>
          <p>(1) <strong>Na⁺/K⁺-ATPase:</strong> transportiert unter ATP-Hydrolyse 3 Na⁺ nach außen und 2 K⁺ nach innen. Elektrogen, da pro Zyklus eine Nettoladung nach außen verlagert wird.<br>
          (2) <strong>K⁺-Leckkanäle:</strong> die Ruhemembran ist überwiegend K⁺-permeabel. K⁺ diffundiert entlang des Konzentrationsgradienten nach außen; die zurückbleibenden Anionen erzeugen das negative Innenpotential.<br>
          (3) <strong>Impermeable Anionen</strong> (Proteine, Phosphate) im Cytosol verstärken die Negativierung.</p>
          <p>Es stellt sich ein elektrochemisches Gleichgewicht nahe dem Kalium-Gleichgewichtspotential ein.</p>` },

      { t: "Depolarisation und das Alles-oder-Nichts-Prinzip",
        visual: `<p>Ein Reiz hebt das Potential an. Erst ab einem bestimmten Wert passiert etwas – und dann sofort alles.</p>
          <div class="visual-box"><svg width="100%" height="150" viewBox="0 0 320 150" style="max-width:320px;display:block;margin:0 auto">
          <line x1="20" y1="110" x2="304" y2="110" stroke="rgba(255,255,255,.14)"/>
          <line x1="20" y1="88" x2="304" y2="88" stroke="rgba(242,177,121,.4)" stroke-dasharray="4 4"/>
          <text x="228" y="84" fill="#f2b179" font-size="10" font-family="monospace">Schwelle −50 mV</text>
          <path d="M20 110 L70 106 L88 88 L104 18 L124 100 L140 122 L170 110 L304 110" fill="none" stroke="#7d6cf6" stroke-width="2.4"/>
          <text x="96" y="14" fill="#a99cff" font-size="10" font-family="monospace">+30 mV</text>
          <text x="20" y="126" fill="#6c7387" font-size="10" font-family="monospace">−70</text>
          </svg></div>
          <p>Unter der Schwelle: nichts. Über der Schwelle: das volle Aktionspotential, immer in gleicher Höhe.</p>`,
        auditory: `<p>Der Kernsatz dieses Themas:</p>
          <div class="audio-box"><p style="margin:0"><em>„Alles oder nichts – ein stärkerer Reiz macht das Aktionspotential nicht größer, sondern häufiger.“</em></p></div>
          <p>Der Ablauf: Ein Reiz depolarisiert die Membran. Erreicht sie den <strong>Schwellenwert</strong> von etwa −50 mV, öffnen sich <strong>spannungsgesteuerte Natriumkanäle</strong>. Na⁺ strömt ein, das Innere wird positiv – bis etwa <strong>+30 mV</strong>.</p>
          <p>Und weil einströmendes Na⁺ weitere Kanäle öffnet, verstärkt sich der Vorgang selbst: eine <em>positive Rückkopplung</em>. Deshalb gibt es kein halbes Aktionspotential.</p>`,
        kinesthetic: `<div class="kinetic-box"><p style="margin:0"><strong>Denk kurz nach, bevor du weiterliest.</strong> Ein Neuron wird doppelt so stark gereizt wie zuvor. Was ändert sich am einzelnen Aktionspotential?</p></div>
          <p><strong>Nichts.</strong> Die Amplitude bleibt gleich. Was sich ändert, ist die <strong>Frequenz</strong> – es feuern mehr Aktionspotentiale pro Sekunde.</p>
          <p>So codiert das Nervensystem Reizstärke: nicht über die Höhe, sondern über die <em>Frequenz</em>. Genau das wird in Prüfungen abgefragt, oft anhand eines Diagramms mit unterschiedlich dichten Ausschlägen.</p>`,
        textual: `<p><strong>Depolarisationsphase.</strong></p>
          <p>Ein überschwelliger Reiz depolarisiert die Membran bis zum <strong>Schwellenpotential</strong> (ca. −50 mV). Daraufhin öffnen spannungsgesteuerte Na⁺-Kanäle.</p>
          <p>Der Na⁺-Einstrom erfolgt entlang des elektrochemischen Gradienten und depolarisiert die Membran weiter, was zusätzliche Na⁺-Kanäle öffnet – <strong>positive Rückkopplung</strong>. Das Membranpotential steigt auf ca. +30 mV (Overshoot).</p>
          <p><strong>Alles-oder-Nichts-Prinzip:</strong> Wird die Schwelle erreicht, läuft das Aktionspotential stets mit gleicher Amplitude und gleichem Zeitverlauf ab; unterschwellige Reize lösen kein Aktionspotential aus. Die Reizintensität wird über die <strong>Aktionspotentialfrequenz</strong> codiert (Frequenzcodierung), nicht über die Amplitude.</p>` },

      { t: "Repolarisation und Hyperpolarisation",
        visual: `<p>Nach dem Gipfel muss die Zelle zurück – schnell, sonst kann sie kein zweites Signal senden.</p>
          <div class="visual-box"><div class="mono" style="line-height:2;font-size:13.5px">
          <div><span style="color:#f2b179">+30 mV</span> <span style="color:#6c7387">Na⁺-Kanäle inaktivieren</span></div>
          <div><span style="color:#6c7387">↓ K⁺-Kanäle öffnen (verzögert)</span></div>
          <div><span style="color:var(--teal)">K⁺ strömt aus → Innenraum wieder negativ</span></div>
          <div><span style="color:#6c7387">↓ K⁺-Kanäle schließen träge</span></div>
          <div><span style="color:#f2789a">−80 mV · Hyperpolarisation (Undershoot)</span></div>
          <div><span style="color:#6c7387">↓ Na⁺/K⁺-Pumpe stellt −70 mV wieder her</span></div>
          </div></div>`,
        auditory: `<p>Der Rhythmus dieser Phase, laut gesprochen:</p>
          <div class="audio-box"><p style="margin:0"><em>„Natrium rein, Kalium raus – und Kalium bleibt einen Moment zu lange offen.“</em></p></div>
          <p>Die Na⁺-Kanäle <strong>inaktivieren</strong> nach etwa einer Millisekunde von selbst. Gleichzeitig öffnen sich – verzögert – die spannungsgesteuerten <strong>K⁺-Kanäle</strong>. K⁺ strömt aus, das Innere wird wieder negativ: <em>Repolarisation</em>.</p>
          <p>Weil die K⁺-Kanäle träge schließen, fließt kurz zu viel K⁺ hinaus. Das Potential rutscht unter den Ruhewert, auf etwa −80 mV. Das ist die <strong>Hyperpolarisation</strong>, oft auch Undershoot genannt.</p>`,
        kinesthetic: `<div class="kinetic-box"><p style="margin:0"><strong>Erkläre es dir selbst.</strong> Warum sinkt das Potential kurzzeitig <em>unter</em> die −70 mV, statt genau dort zu stoppen?</p></div>
          <p>Weil die Kaliumkanäle sich <strong>träge schließen</strong>. Sie bleiben einen Moment länger offen, als nötig wäre, und lassen dabei mehr K⁺ hinaus als für das Ruhepotential erforderlich.</p>
          <p>Diese Hyperpolarisation ist kein Fehler, sondern nützlich: Sie erschwert es, sofort ein weiteres Aktionspotential auszulösen – und sorgt so dafür, dass das Signal nur in <em>eine</em> Richtung weiterläuft.</p>`,
        textual: `<p><strong>Repolarisation.</strong> Die Na⁺-Kanäle gehen nach ca. 1 ms in den <em>inaktivierten</em> Zustand über (Inaktivierungstor). Zeitverzögert öffnen spannungsgesteuerte K⁺-Kanäle; der K⁺-Ausstrom entlang des Gradienten repolarisiert die Membran.</p>
          <p><strong>Hyperpolarisation (Undershoot).</strong> Die verzögerte Schließkinetik der K⁺-Kanäle führt zu einem K⁺-Ausstrom über den Gleichgewichtszustand hinaus; das Membranpotential unterschreitet den Ruhewert auf ca. −80 mV.</p>
          <p><strong>Wiederherstellung.</strong> Die Na⁺/K⁺-ATPase stellt die ursprünglichen Ionenverteilungen und damit das Ruhepotential von −70 mV wieder her.</p>
          <p>Zu unterscheiden: <em>geschlossen-aktivierbar</em> und <em>inaktiviert</em> sind zwei verschiedene Kanalzustände. Diese Unterscheidung ist die Grundlage der Refraktärzeit.</p>` },

      { t: "Refraktärzeit und Erregungsleitung",
        visual: `<p>Die Refraktärzeit ist der Grund, warum ein Signal nicht rückwärts läuft.</p>
          <div class="visual-box"><svg width="100%" height="120" viewBox="0 0 300 120" style="max-width:300px;display:block;margin:0 auto">
          <rect x="10" y="40" width="280" height="22" rx="6" fill="rgba(255,255,255,.05)"/>
          <rect x="20" y="40" width="52" height="22" rx="6" fill="rgba(242,120,154,.28)"/>
          <text x="24" y="34" fill="#f2789a" font-size="10" font-family="monospace">refraktär</text>
          <rect x="86" y="40" width="46" height="22" rx="6" fill="rgba(125,108,246,.45)"/>
          <text x="88" y="34" fill="#a99cff" font-size="10" font-family="monospace">aktiv</text>
          <rect x="146" y="40" width="130" height="22" rx="6" fill="rgba(53,214,192,.16)"/>
          <text x="168" y="34" fill="#35d6c0" font-size="10" font-family="monospace">bereit</text>
          <path d="M132 74 L162 74" stroke="#35d6c0" stroke-width="2"/>
          <path d="M156 69 L164 74 L156 79" fill="#35d6c0"/>
          <text x="112" y="98" fill="#6c7387" font-size="10" font-family="monospace">Erregung läuft nur vorwärts</text>
          </svg></div>
          <p>Hinter dem Aktionspotential liegt Membran, die gerade nicht erregbar ist. Also läuft das Signal nur nach vorn.</p>`,
        auditory: `<p>Zwei Begriffe, die auseinandergehalten werden müssen:</p>
          <div class="audio-box"><p style="margin:0"><em>„Absolut refraktär – gar nichts geht. Relativ refraktär – es geht, aber nur mit stärkerem Reiz.“</em></p></div>
          <p>Absolut refraktär ist die Membran, solange die Na⁺-Kanäle inaktiviert sind: kein noch so starker Reiz löst ein Aktionspotential aus. Danach folgt die relative Refraktärzeit während der Hyperpolarisation.</p>
          <p>Und die Leitung: An <strong>myelinisierten</strong> Axonen springt die Erregung von einem Schnürring zum nächsten – <strong>saltatorische Erregungsleitung</strong>. Bis zu 100 Meter pro Sekunde statt etwa einem Meter.</p>`,
        kinesthetic: `<div class="kinetic-box"><p style="margin:0"><strong>Überleg dir das Warum.</strong> Warum läuft ein Aktionspotential nicht in beide Richtungen zurück, obwohl die Membran ringsum erregbar wäre?</p></div>
          <p>Weil der Abschnitt <em>hinter</em> der Erregung gerade <strong>refraktär</strong> ist. Die dortigen Na⁺-Kanäle sind inaktiviert und können nicht erneut öffnen. Nur nach vorn liegt erregbare Membran – deshalb ist die Leitungsrichtung eindeutig.</p>
          <p>Zweiter Effekt, den du kennen musst: Die Refraktärzeit begrenzt die maximale Frequenz. Bei etwa 1–2 ms absoluter Refraktärzeit sind höchstens rund 500–1000 Aktionspotentiale pro Sekunde möglich.</p>`,
        textual: `<p><strong>Refraktärzeit.</strong></p>
          <p><em>Absolute Refraktärzeit</em> (ca. 1–2 ms): Die Na⁺-Kanäle befinden sich im inaktivierten Zustand und sind unabhängig von der Reizstärke nicht aktivierbar.<br>
          <em>Relative Refraktärzeit:</em> Während der Hyperpolarisation ist ein Aktionspotential auslösbar, erfordert jedoch einen überdurchschnittlich starken Reiz.</p>
          <p><strong>Funktionen:</strong> (1) Sicherstellung der unidirektionalen Erregungsleitung, da die rückwärtige Membran refraktär ist; (2) Begrenzung der maximalen Aktionspotentialfrequenz auf ca. 500–1000 Hz.</p>
          <p><strong>Erregungsleitung.</strong> <em>Kontinuierlich</em> an marklosen Axonen (ca. 1 m/s). <em>Saltatorisch</em> an myelinisierten Axonen: Depolarisation erfolgt nur an den Ranvier-Schnürringen, das Signal „springt“ – bis ca. 100 m/s bei zugleich geringerem Energieaufwand.</p>` }
    ],
    practice: [
      { d: .2, q: "Wie hoch ist das Ruhepotential einer Nervenzelle näherungsweise?", opts: ["−70 mV", "0 mV", "+30 mV", "−120 mV"], a: "−70 mV", why: "Innen negativ gegenüber außen, etwa −70 mV." },
      { d: .3, q: "Welches Ionenverhältnis transportiert die Natrium-Kalium-Pumpe?", opts: ["3 Na⁺ raus, 2 K⁺ rein", "2 Na⁺ raus, 3 K⁺ rein", "1 Na⁺ raus, 1 K⁺ rein", "3 K⁺ raus, 2 Na⁺ rein"], a: "3 Na⁺ raus, 2 K⁺ rein", why: "Netto verlässt pro Zyklus eine positive Ladung die Zelle – die Pumpe ist elektrogen." },
      { d: .35, q: "Was geschieht bei Erreichen des Schwellenwerts von etwa −50 mV?", opts: ["Spannungsgesteuerte Na⁺-Kanäle öffnen sich", "K⁺-Kanäle schließen sich", "Die Pumpe stoppt", "Die Zelle hyperpolarisiert"], a: "Spannungsgesteuerte Na⁺-Kanäle öffnen sich", why: "Der Na⁺-Einstrom startet die Depolarisation – mit positiver Rückkopplung." },
      { d: .45, q: "Ein Reiz wird verdoppelt. Was ändert sich am Aktionspotential?", opts: ["Die Amplitude verdoppelt sich", "Die Frequenz steigt, die Amplitude bleibt gleich", "Es wird länger", "Nichts ändert sich"], a: "Die Frequenz steigt, die Amplitude bleibt gleich", why: "Alles-oder-Nichts-Prinzip: Reizstärke wird über die Frequenz codiert." },
      { d: .55, q: "Wodurch entsteht die Hyperpolarisation nach dem Aktionspotential?", opts: ["Die K⁺-Kanäle schließen verzögert", "Die Na⁺-Kanäle öffnen erneut", "Die Pumpe arbeitet rückwärts", "Chlorid strömt ein"], a: "Die K⁺-Kanäle schließen verzögert", why: "Zu viel K⁺ verlässt die Zelle, das Potential unterschreitet −70 mV." },
      { d: .6, q: "Warum läuft die Erregung nur in eine Richtung?", opts: ["Der Bereich dahinter ist refraktär", "Die Myelinscheide blockiert eine Richtung", "Die Pumpe bestimmt die Richtung", "Das Axon ist einseitig durchlässig"], a: "Der Bereich dahinter ist refraktär", why: "Die Na⁺-Kanäle dort sind inaktiviert und können nicht erneut öffnen." },
      { d: .7, q: "An einem myelinisierten Axon wird die Leitungsgeschwindigkeit gemessen. Was bewirkt die Myelinisierung?", opts: ["Saltatorische Leitung, deutlich schneller", "Kontinuierliche Leitung, langsamer", "Höheres Ruhepotential", "Längere Refraktärzeit"], a: "Saltatorische Leitung, deutlich schneller", why: "Die Erregung springt von Schnürring zu Schnürring – bis ca. 100 m/s." },
      { d: .8, q: "Ein Gift blockiert die Na⁺/K⁺-ATPase. Welche unmittelbare Folge ist zu erwarten?", opts: ["Das Ruhepotential bricht allmählich zusammen", "Das Aktionspotential wird sofort größer", "Die Zelle hyperpolarisiert dauerhaft", "Nichts, die Pumpe ist entbehrlich"], a: "Das Ruhepotential bricht allmählich zusammen", why: "Ohne aktiven Transport gleichen sich die Ionengradienten mit der Zeit aus." },
      { d: .85, q: "Warum ist zwischen 'geschlossen' und 'inaktiviert' bei Na⁺-Kanälen zu unterscheiden?", opts: ["Nur inaktivierte Kanäle sind nicht reaktivierbar – das erklärt die absolute Refraktärzeit", "Es ist dasselbe", "Geschlossene Kanäle leiten K⁺", "Inaktivierte Kanäle leiten rückwärts"], a: "Nur inaktivierte Kanäle sind nicht reaktivierbar – das erklärt die absolute Refraktärzeit", why: "Genau diese Unterscheidung ist die Grundlage der Refraktärzeit." }
    ]
  },

  gesch_teilung: {
    subject: "Geschichte", name: "Deutschland 1945–1990", load: 3, lf: false,
    steps: [
      { t: "Besatzungszonen und Potsdam 1945",
        visual: `<p>Deutschland wird nicht regiert, sondern verwaltet – von vier Siegermächten mit vier verschiedenen Interessen.</p>
          <div class="visual-box"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px">
          <div style="padding:10px;border-radius:9px;background:rgba(125,108,246,.14)"><strong>USA</strong><br><span class="mute">Marktwirtschaft, Demokratie</span></div>
          <div style="padding:10px;border-radius:9px;background:rgba(53,214,192,.12)"><strong>Großbritannien</strong><br><span class="mute">Industrie, Ruhrgebiet</span></div>
          <div style="padding:10px;border-radius:9px;background:rgba(242,177,121,.12)"><strong>Frankreich</strong><br><span class="mute">Sicherheit, Dezentralisierung</span></div>
          <div style="padding:10px;border-radius:9px;background:rgba(242,120,154,.14)"><strong>UdSSR</strong><br><span class="mute">Reparationen, Pufferzone</span></div>
          </div></div>
          <p>Potsdam einigt sich auf die <strong>vier D</strong>: Demilitarisierung, Denazifizierung, Demokratisierung, Dezentralisierung. Nur: jede Macht legt sie anders aus.</p>`,
        auditory: `<p>Die vier Ziele von Potsdam kannst du als Reihe sprechen – sie beginnen alle gleich:</p>
          <div class="audio-box"><p style="margin:0"><em>„Demilitarisierung, Denazifizierung, Demokratisierung, Dezentralisierung.“</em> Die vier D.</p></div>
          <p>Klingt nach Einigkeit. War aber keine. <em>Demokratisierung</em> bedeutete in Washington freie Wahlen – in Moskau die Herrschaft der Arbeiterklasse. Dasselbe Wort, zwei Ordnungen.</p>
          <p>Dazu die Reparationsfrage: Die Sowjetunion hatte 27 Millionen Tote und demontierte Industrieanlagen. Die Westmächte wollten eine funktionierende deutsche Wirtschaft, weil ein verarmtes Deutschland niemandem nützte.</p>`,
        kinesthetic: `<div class="kinetic-box"><p style="margin:0"><strong>Nimm 30 Sekunden für Stalins Position.</strong> Warum bestand die Sowjetunion auf Reparationen und einer Pufferzone?</p></div>
          <p>Du landest vermutlich beim historischen Kern: <strong>27 Millionen sowjetische Tote</strong> und zwei deutsche Angriffe über die polnische Ebene innerhalb von dreißig Jahren. Eine Pufferzone war aus dieser Perspektive keine Aggression, sondern die Lehre aus 1941.</p>
          <p>Jetzt die Gegenseite: offene Märkte, Selbstbestimmung, kein zweites Versailles mit wirtschaftlichem Ruin. Ebenfalls nachvollziehbar.</p>
          <p>Genau das ist das <strong>Sicherheitsdilemma</strong> – beide Seiten handeln rational für die eigene Sicherheit und verringern damit die des anderen. Für Abituraufgaben ist dieser Begriff Gold wert.</p>`,
        textual: `<p><strong>Potsdamer Konferenz (17. Juli – 2. August 1945):</strong> Truman, Stalin, Churchill (ab 28. Juli Attlee).</p>
          <p><strong>Beschlüsse:</strong> Aufteilung in vier Besatzungszonen, gemeinsame Verwaltung durch den Alliierten Kontrollrat, Oder-Neiße-Linie als vorläufige Westgrenze Polens, Umsiedlung der deutschen Bevölkerung aus den Ostgebieten, Reparationen primär aus der jeweils eigenen Zone.</p>
          <p><strong>Die „vier D“:</strong> Demilitarisierung, Denazifizierung, Demokratisierung, Dezentralisierung.</p>
          <p><strong>Konfliktkern:</strong> Die Begriffe blieben bewusst unbestimmt. Die divergierende Auslegung – insbesondere von „Demokratisierung“ – sowie der Streit um Reparationen führten binnen weniger Jahre zur faktischen Teilung. Analytisch fassbar als <em>Sicherheitsdilemma</em>.</p>` },

      { t: "Währungsreform und Berlin-Blockade",
        visual: `<p>1948 wird aus wirtschaftlicher Trennung eine politische. West-Berlin liegt 160 km innerhalb der sowjetischen Zone.</p>
          <div class="visual-box"><svg width="100%" height="124" viewBox="0 0 300 124" style="max-width:300px;display:block;margin:0 auto">
          <rect x="14" y="16" width="272" height="94" rx="7" fill="rgba(242,120,154,.09)" stroke="rgba(242,120,154,.3)"/>
          <text x="26" y="34" fill="#f2789a" font-size="10.5" font-family="monospace">Sowjetische Zone</text>
          <rect x="126" y="46" width="54" height="44" rx="5" fill="rgba(125,108,246,.28)" stroke="#7d6cf6"/>
          <text x="153" y="72" text-anchor="middle" fill="#a99cff" font-size="9.5" font-family="monospace">West-Berlin</text>
          <path d="M14 64 L124 64" stroke="#35d6c0" stroke-width="2" stroke-dasharray="4 4"/>
          <text x="20" y="104" fill="#35d6c0" font-size="10" font-family="monospace">Luftbrücke →</text>
          </svg></div>
          <p><strong>Juni 1948:</strong> D-Mark im Westen. Stalin sperrt alle Land- und Wasserwege. Der Westen fliegt <strong>323 Tage</strong> lang.</p>`,
        auditory: `<p>Ein Satz fasst die Berlin-Krise:</p>
          <div class="audio-box"><p style="margin:0"><em>„Stalin schloss die Straßen – der Westen öffnete den Himmel.“</em></p></div>
          <p>Auslöser war die <strong>Währungsreform</strong> vom Juni 1948: die D-Mark in den Westzonen. Für Moskau war das der sichtbare Beweis, dass ein westdeutscher Separatstaat entstand.</p>
          <p>Die Blockade dauerte vom 24. Juni 1948 bis zum 12. Mai 1949. Über zwei Millionen Tonnen Güter, in der Spitze etwa alle <em>90 Sekunden</em> eine Landung.</p>
          <p>Der entscheidende Punkt: Um die Luftbrücke zu stoppen, hätte Stalin ein unbewaffnetes Transportflugzeug mit Lebensmitteln abschießen müssen. Er tat es nicht.</p>`,
        kinesthetic: `<div class="kinetic-box"><p style="margin:0"><strong>Du bist Truman, Juni 1948.</strong> Berlin ist blockiert. Panzer über die Autobahn schicken – oder einen anderen Weg finden? Entscheide, bevor du weiterliest.</p></div>
          <p>Panzer hätten bedeutet, den ersten Schuss abzugeben – möglicherweise Krieg. Die <strong>Luftbrücke</strong> drehte diese Last vollständig um: Nun hätte <em>Stalin</em> zuerst schießen müssen, auf ein Flugzeug voller Mehl und Kohle.</p>
          <p><strong>323 Tage.</strong> Rund 2,3 Millionen Tonnen. Am 12. Mai 1949 hob die Sowjetunion die Blockade auf.</p>
          <p>Damit war die Regel des Kalten Krieges gesetzt: maximaler Druck, aber unterhalb der Schwelle direkter Gewalt.</p>`,
        textual: `<p><strong>Währungsreform (20. Juni 1948):</strong> Einführung der Deutschen Mark in den drei Westzonen, wenige Tage später auch in West-Berlin. Aus sowjetischer Sicht ein einseitiger Bruch der Potsdamer Vereinbarungen und Vorstufe eines westdeutschen Staates.</p>
          <p><strong>Berlin-Blockade (24. Juni 1948 – 12. Mai 1949):</strong> Sperrung sämtlicher Land- und Wasserwege nach West-Berlin.</p>
          <p><strong>Luftbrücke:</strong> 323 Tage; ca. 2,3 Mio. Tonnen Versorgungsgüter; in Spitzenzeiten eine Landung im Abstand von rund 90 Sekunden. Der Begriff „Rosinenbomber“ prägte die westdeutsche Erinnerungskultur nachhaltig.</p>
          <p><strong>Bedeutung:</strong> Die Krise etablierte das Muster der Konfrontation unterhalb der Schwelle offener Gewalt und beschleunigte die Staatsgründungen von 1949.</p>` },

      { t: "Zwei Staaten – 1949 bis 1961",
        visual: `<div class="visual-box"><div style="font-size:13.5px;line-height:2" class="mono">
          <div><span style="color:#35d6c0">23. Mai 1949</span> · Grundgesetz – <strong>Bundesrepublik</strong></div>
          <div><span style="color:#f2789a">7. Okt. 1949</span> · Verfassung – <strong>DDR</strong></div>
          <div><span style="color:#6c7387">1955</span> · BRD in die NATO, DDR in den Warschauer Pakt</div>

          <div><span style="color:#f2b179">13. Aug. 1961</span> · <strong>Mauerbau</strong></div>
          </div></div>
          <p>Die Mauer war kein Machtbeweis, sondern eine Notmaßnahme: die DDR verlor ihre Ausgebildeten schneller, als sie sie ausbilden konnte.</p>`,
        auditory: `<p>Zwei Daten aus dem Jahr 1949, die du sicher können musst:</p>

/* Fallback for syllabus topics without authored content. */
function genericTopic(name, subject) {
  const n = esc(name);
  const mk = (title, body) => ({ t: title, visual: body, auditory: body, kinesthetic: body, textual: body });
  return {
    subject: subject || "Allgemein", name: name, load: 3, generic: true,
    steps: [
      mk("Einordnen", `<p>Hier würde eingeordnet, was <strong>${n}</strong> ist, wo es an dein Vorwissen anschließt und warum es im Bildungsplan steht.</p>
        <div class="visual-box"><p style="margin:0;font-size:14px;color:#a2a8bd">Dieses Thema stammt aus deinen Prüfungsfächern, hat aber noch keinen ausgearbeiteten Inhalt. Die <em>Struktur</em> der Lerneinheit steht – die Fachinhalte entstehen automatisch, sobald ein KI-Anbieter angebunden ist. Details im Build Guide.</p></div>`),
      mk("Kernmechanismus", `<p>Die zentrale Regel oder der zentrale Vorgang bei <strong>${n}</strong> – das eine, aus dem der Rest folgt.</p>`),
      mk("Musterlösung", `<p>Ein vollständig durchgerechnetes bzw. durchargumentiertes Beispiel zu <strong>${n}</strong>, im Format, das zu dir passt.</p>`),
      mk("Selbst anwenden", `<p>Du bearbeitest <strong>${n}</strong> selbst – mit der Schwierigkeit, die der Motor auf deinen Stand einstellt.</p>`),
      mk("Stolperfallen", `<p>Grenzfälle und typische Fehler bei <strong>${n}</strong> – die Stellen, an denen im Abitur Punkte verloren gehen.</p>`)
    ],
    practice: [
      { d: .3, q: `Platzhalter-Frage zu <strong>${n}</strong> – echte Aufgaben entstehen mit angebundenem KI-Anbieter.`,
        opts: ["Verstanden", "Thema überspringen", "Später erinnern", "Als wiederholt markieren"], a: "Verstanden",
        why: "Die Struktur läuft bereits; die Inhaltserzeugung braucht die im Build Guide beschriebene KI-Anbindung." }
    ]
  };
}
function getTopic(id) {
  if (TOPICS[id]) return TOPICS[id];
  const found = S.subjects.flatMap(s => s.topics.map(t => ({ t: t, s: s }))).find(x => x.t.id === id);
  return found ? genericTopic(found.t.name, found.s.name) : null;
}

/* ---------- 4. ADAPTIVE ENGINE ---------------------------
   This is the part that is genuinely "adaptive" — not scripted.
   Every function here reads live learner state and returns a decision.
   --------------------------------------------------------- */
const BLOCKS = [6, 8, 10, 12, 14, 16, 18, 20];
const MODES = ["visual", "auditory", "kinesthetic", "textual"];
const STEEP = 4;               // logistic steepness of the success curve
const IDEAL_SUCCESS = 0.78;    // zone of proximal development target

const Engine = {

  /* -- progress record accessor -- */
  rec(topicId) {
    if (!S.progress[topicId]) {
      S.progress[topicId] = {
        mastery: 0.08, attempts: 0, correct: 0, avgMs: 9000,
        modality: { visual: [0, 0], auditory: [0, 0], kinesthetic: [0, 0], textual: [0, 0] },
        recent: [], seen: [], stepIdx: 0, lastMode: null
      };
    }
    return S.progress[topicId];
  },

  /* -- 4.1 Mastery update.
     Elo-style: move toward the surprise. Learning rate decays with
     experience so early evidence counts more than the hundredth attempt. -- */
  updateMastery(topicId, correct, ms, difficulty, mode) {
    const r = this.rec(topicId);
    const expected = sigmoid((r.mastery - difficulty) * STEEP);
    const K = 0.30 / (1 + r.attempts * 0.11);
    let delta = K * ((correct ? 1 : 0) - expected);

    // fast + correct is stronger evidence of mastery than slow + correct
    if (correct && ms < r.avgMs * 0.65) delta *= 1.22;
    // slow + correct suggests reconstruction, not recall
    if (correct && ms > r.avgMs * 1.8) delta *= 0.75;

    r.mastery = clamp(r.mastery + delta, 0, 0.995);
    r.attempts++;
    if (correct) r.correct++;
    r.avgMs = r.attempts === 1 ? ms : r.avgMs * 0.75 + ms * 0.25;
    r.recent.push({ c: correct ? 1 : 0, ms: ms });
    if (r.recent.length > 6) r.recent.shift();

    if (mode && r.modality[mode]) {
      r.modality[mode][0] += correct ? 1 : 0;
      r.modality[mode][1] += 1;
    }
    S.log.push({ t: Date.now(), topicId: topicId, correct: !!correct, ms: ms, d: difficulty });
    if (S.log.length > 400) S.log.shift();
    Store.save();
    return delta;
  },

  /* -- 4.2 Target difficulty (ZPD).
     Solve sigmoid((m − d)·k) = target for d, then shift the target
     according to live state: tired or overwhelmed → aim easier;
     on a hot streak → aim harder. -- */
  targetDifficulty(topicId) {
    const r = this.rec(topicId);
    let target = IDEAL_SUCCESS;
    const e = this.energyNow();
    if (e <= 2) target += 0.07;                       // low energy → easier
    if (S.attention.overwhelm >= 4) target += 0.05;   // overwhelm-prone → easier
    if (S.attention.span < 15) target += 0.03;

    const last3 = r.recent.slice(-3);
    if (last3.length === 3 && last3.every(x => x.c)) target -= 0.09;      // flowing → push
    if (last3.length >= 2 && last3.slice(-2).every(x => !x.c)) target += 0.10; // struggling → catch them

    target = clamp(target, 0.55, 0.93);
    const d = r.mastery - Math.log(target / (1 - target)) / STEEP;
    return clamp(d, 0.05, 0.95);
  },

  /* -- 4.3 Question selection: nearest unseen item to target difficulty -- */
  pickPractice(topicId) {
    const topic = getTopic(topicId);
    if (!topic) return null;
    const r = this.rec(topicId);
    const target = this.targetDifficulty(topicId);
    let pool = topic.practice.filter(q => !r.seen.includes(q.q));
    if (!pool.length) { r.seen = []; pool = topic.practice; }
    pool = pool.slice().sort((a, b) => Math.abs(a.d - target) - Math.abs(b.d - target));
    const q = pool[0];
    r.seen.push(q.q);
    return { q: q, target: target };
  },

  /* -- 4.4 Pacing verdict from the rolling window -- */
  pace(topicId) {
    const r = this.rec(topicId);
    const w = r.recent.slice(-5);
    if (w.length < 3) return { v: "hold", why: "pace_why_cal" };
    const acc = mean(w.map(x => x.c));
    const speed = mean(w.map(x => x.ms)) / Math.max(r.avgMs, 1);
    if (acc >= 0.8 && speed < 0.95) return { v: "accelerate", why: "pace_why_acc" };
    if (acc <= 0.4) return { v: "decompose", why: "pace_why_dec" };
    if (speed > 1.65) return { v: "decompose", why: "pace_why_slow" };
    return { v: "hold", why: "pace_why_hold" };
  },

  /* -- 4.5 How many micro-steps fit this session?
     Driven by attention span, topic cognitive load, and current energy. -- */
  microSteps(topicId) {
    const topic = getTopic(topicId);
    if (!topic) return 1;
    const perStep = 2.2 + topic.load * 0.55;
    let n = S.attention.span / perStep;
    const e = this.energyNow();
    n *= (0.62 + e * 0.115);                       // 1→0.74x  5→1.20x
    if (S.attention.overwhelm >= 4) n *= 0.78;
    if (this.pace(topicId).v === "accelerate") n *= 1.3;
    if (this.pace(topicId).v === "decompose") n *= 0.7;
    return clamp(Math.round(n), 1, topic.steps.length);
  },

  /* -- 4.6 Modality choice.
     Blend of stated preference and observed performance, with
     ε-exploration so the profile keeps being tested, plus a novelty
     penalty for learners who burn out on repetition. -- */
  modality(topicId) {
    const r = this.rec(topicId);
    const tot = sum(MODES.map(m => S.style[m])) || 1;
    const scored = MODES.map(m => {
      const stated = S.style[m] / tot;
      const [c, n] = r.modality[m];
      const observed = n >= 2 ? c / n : null;
      // shrink observed toward stated until there's real evidence
      const w = observed === null ? stated : stated * 0.55 + observed * 0.45;
      const novelty = (m === r.lastMode) ? (1 - (S.attention.novelty - 1) * 0.16) : 1;
      return { m: m, s: Math.max(w * novelty, 0.02) };
    });
    let chosen;
    if (Math.random() < 0.15) {                    // explore
      chosen = pick(MODES);
    } else {                                        // exploit (roulette)
      const total = sum(scored.map(x => x.s));
      let t = Math.random() * total;
      chosen = scored[scored.length - 1].m;
      for (const x of scored) { t -= x.s; if (t <= 0) { chosen = x.m; break; } }
    }
    r.lastMode = chosen;
    return chosen;
  },

  /* -- 4.7 Variable-ratio reward scheduler.
     Fixed rewards stop working — the brain prices them in. This uses a
     variable schedule with guaranteed moments at psychologically
     important points (recovery after failure, session completion). -- */
  reward(ctx) {
    const rs = S.rewardState;
    rs.sinceLast++;
    let fire = false, kind = "small", xp = 10;

    if (ctx.comeback) { fire = true; kind = "comeback"; xp = 22; }
    else if (ctx.stepDone) { fire = true; kind = "step"; xp = 15; }
    else if (ctx.sessionDone) { fire = true; kind = "session"; xp = 45; }
    else if (ctx.correct) {
      let p = 0.34 + rs.sinceLast * 0.13;           // pressure builds → feels unpredictable, never punishing
      if (S.attention.novelty >= 4) p += 0.08;
      if (Math.random() < p) { fire = true; kind = "small"; xp = 8 + Math.floor(Math.random() * 8); }
      if (Math.random() < 0.022) { fire = true; kind = "jackpot"; xp = 40 + Math.floor(Math.random() * 25); }
    }
    if (!fire) return null;
    rs.sinceLast = 0;

    const bank = {
      small: ["Clean.", "That's it.", "Locked in.", "Correct.", "Sharp.", "Yes — that's the one."],
      step:  ["Step complete.", "That piece is yours.", "One down."],
      comeback: ["You got it on the second pass — that's the one that sticks.",
                 "Missed, adjusted, landed. That's actual learning.",
                 "Recovered. That's worth more than getting it first time."],
      jackpot: ["⚡ Streak bonus!", "⚡ Big one.", "⚡ Bonus round."],
      session: ["Session complete.", "That's the block done."]
    };
    let msg = pick(bank[kind]);
    if (kind === rs.lastKind && kind === "small") msg = pick(bank.small);
    rs.lastKind = kind;

    S.xp += xp;
    const newLevel = Math.floor(Math.sqrt(S.xp / 45)) + 1;
    let levelled = false;
    if (newLevel > S.level) { S.level = newLevel; levelled = true; }
    Store.save();
    return { msg: msg, xp: xp, kind: kind, levelled: levelled };
  },

  /* -- 4.8 Chronobiology -- */
  blockFor(hour) {
    let best = BLOCKS[0];
    for (const b of BLOCKS) if (hour >= b) best = b;
    return best;
  },
  energyAt(hour) { const v = S.energy[this.blockFor(hour)]; return v == null ? 3 : v; },
  energyNow() { return this.energyAt(new Date().getHours()); },
  peakBlocks() {
    const vals = BLOCKS.map(b => ({ b: b, v: S.energy[b] == null ? 3 : S.energy[b] }));
    const top = Math.max.apply(null, vals.map(x => x.v));
    return vals.filter(x => x.v === top).map(x => x.b);
  },

  /* -- 4.9 Daily schedule.
     Rank topics by urgency × mastery gap, rank time blocks by energy,
     then match heaviest cognitive load to highest energy. -- */
  allTopics() {
    const out = [];
    S.subjects.forEach(s => s.topics.forEach(t => {
      const known = TOPICS[t.id];
      out.push({
        id: t.id, name: t.name, subject: s.name,
        load: known ? known.load : 3, exam: t.exam,
        mastery: this.rec(t.id).mastery,
        steps: known ? known.steps.length : 5
      });
    }));
    return out;
  },
  priority(t) {
    const d = daysUntil(t.exam);
    let urgency = 0.28;
    if (d !== null) urgency = d <= 0 ? 1 : clamp(1 / (1 + d / 6), 0.2, 1);
    const gap = 1 - t.mastery;
    return urgency * 0.54 + gap * 0.46;
  },
  schedule() {
    const topics = this.allTopics();
    if (!topics.length) return [];
    const ranked = topics.map(t => ({ t: t, p: this.priority(t) })).sort((a, b) => b.p - a.p);

    const nowH = new Date().getHours();
    let blocks = BLOCKS.filter(b => b + 2 > nowH)
      .map(b => ({ h: b, e: S.energy[b] == null ? 3 : S.energy[b] }));
    if (!blocks.length) blocks = BLOCKS.map(b => ({ h: b, e: S.energy[b] == null ? 3 : S.energy[b] }));

    // how much can this person realistically do today?
    let capacity = clamp(Math.round(S.attention.span / 11) + 1, 2, 5);
    capacity = Math.min(capacity, blocks.length, ranked.length);

    // heaviest cognitive demand → highest energy block
    const byDemand = ranked.slice(0, capacity)
      .map(x => ({ x: x, demand: x.p * 0.5 + (x.t.load / 5) * 0.5 }))
      .sort((a, b) => b.demand - a.demand);
    const byEnergy = blocks.slice().sort((a, b) => b.e - a.e);

    const peak = this.peakBlocks();
    const plan = byDemand.map((d, i) => {
      const blk = byEnergy[i];
      return {
        hour: blk.h, energy: blk.e, topic: d.x.t, priority: d.x.p,
        peak: peak.indexOf(blk.h) !== -1,
        mins: clamp(Math.round(S.attention.span * (0.7 + d.x.t.load * 0.09)), 8, 55),
        done: S.completedToday.indexOf(d.x.t.id) !== -1
      };
    });
    return plan.sort((a, b) => a.hour - b.hour);
  },

  /* -- 4.10 Interest weaving (flavour source is set in section 5) -- */
  weave(text, f) {
    f = f || this.flavor();
    return String(text)
      .replace(/\{scen\}/g, f.scen).replace(/\{objA\}/g, f.objA || f.obj).replace(/\{obj\}/g, f.obj)
      .replace(/\{unit\}/g, f.unit).replace(/\{who\}/g, f.who)
      .replace(/\{Who\}/g, f.who.charAt(0).toUpperCase() + f.who.slice(1));
  },

  /* -- 4.11 Cognitive composite -- */
  composite() {
    const c = S.cog;
    const parts = [c.pattern, c.logic, c.speed, c.memory].filter(x => x != null);
    if (!parts.length) return null;
    return Math.round(mean(parts));
  },
  dominantStyle() {
    let best = "visual", bv = -1;
    MODES.forEach(m => { if (S.style[m] > bv) { bv = S.style[m]; best = m; } });
    return best;
  },
  styleBlend() {
    const tot = sum(MODES.map(m => S.style[m])) || 1;

function runChoiceQuiz(cfg) {
  FLOW.qz = { i: 0, items: cfg.items, ans: [], t0: 0, cfg: cfg };

}
function renderChoiceQ() {
  stopTick();
  const z = FLOW.qz, it = z.items[z.i];
  FLOW.redraw = renderChoiceQ;
  z.t0 = Date.now();
  let left = z.cfg.limit;
  const opts = it.seq ? it.opts : L(it.opts);
  const answer = it.seq ? it.a : L(it.opts)[it.ai];
  z.answer = answer;

  const body = it.seq
    ? `<div class="q-text">${t("q_next")}</div>
       <div class="seq">${it.seq.map((v, i) =>
         `<div class="seq-cell" style="animation-delay:${i * 55}ms">${esc(v)}</div>`).join("")}
         <div class="seq-cell q" style="animation-delay:${it.seq.length * 55}ms">?</div></div>`
    : `<div class="q-text">${L(it.q)}</div>`;

  mount(rail(z.cfg.step) + `<div class="center-wrap"><div class="stage">
    <div class="assess-head">
      <div><div class="eyebrow">${t(z.cfg.titleKey)}</div>
        <div class="q-num" style="margin-top:5px">${t("q_of", { n: z.i + 1, t: z.items.length })}</div></div>
      <div class="timer-ring"><svg width="44" height="44">
        <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"/>
        <circle id="ring" cx="22" cy="22" r="18" fill="none" stroke="var(--accent)" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="0"/></svg>
        <span id="ringtxt" class="mute">${left}</span></div>
    </div>
    ${body}
    <div class="opts">${shuffle(opts).map((o, i) =>
      `<button class="opt" data-act="ansChoice" data-v="${esc(o)}">
        <span class="opt-key">${"ABCD"[i]}</span><span>${o}</span></button>`).join("")}</div>
  </div></div>`);

  TICK = setInterval(() => {
    left--;
    const ring = document.getElementById("ring"), txt = document.getElementById("ringtxt");
    if (!ring) { stopTick(); return; }
    ring.setAttribute("stroke-dashoffset", String(113 * (1 - left / z.cfg.limit)));
    txt.textContent = String(Math.max(left, 0));
    if (left <= 5) { ring.setAttribute("stroke", "var(--amber)"); txt.className = ""; }
    if (left <= 0) { stopTick(); ACT.ansChoice(null, { v: "__timeout__" }); }
  }, 1000);
}
ACT.ansChoice = (el, d) => {
  stopTick();
  const z = FLOW.qz, it = z.items[z.i];
  const ms = Date.now() - z.t0;
  const correct = d.v === z.answer;
  z.ans.push({ correct: correct, ms: ms, d: it.d });
  FLOW.redraw = null;

  document.querySelectorAll(".opt").forEach(o => {
    if (o.dataset.v === z.answer) o.classList.add("correct");
    else if (o.dataset.v === d.v) o.classList.add("wrong");
    o.removeAttribute("data-act");
  });
  const stage = document.querySelector(".stage");
  if (stage && it.why) {
    const n = document.createElement("p");
    n.className = "hint";
    n.style.cssText = "margin-top:16px;animation:fadeIn .3s";
    n.innerHTML = (correct ? "✓ " : "→ ") + esc(L(it.why));
    stage.appendChild(n);
  }
  setTimeout(() => {
    z.i++;
    if (z.i < z.items.length) renderChoiceQ(); else z.cfg.done(z.ans);
  }, correct ? 900 : 1900);
};
function weightedScore(ans) {
  const max = sum(ans.map(a => 0.5 + a.d));
  const got = sum(ans.map(a => a.correct ? 0.5 + a.d : 0));
  return Math.round(clamp(got / max, 0, 1) * 100);
}

});

function scrProgress() {
  const topics = Engine.allTopics();

  const modAgg = { visual: [0, 0], auditory: [0, 0], kinesthetic: [0, 0], textual: [0, 0] };
  Object.keys(S.progress).forEach(k => MODES.forEach(m => {
    modAgg[m][0] += S.progress[k].modality[m][0];
    modAgg[m][1] += S.progress[k].modality[m][1];
  }));
  const modRows = MODES.map(m => ({ m: m, n: modAgg[m][1], r: modAgg[m][1] ? modAgg[m][0] / modAgg[m][1] : null }))
    .sort((a, b) => (b.r == null ? -1 : b.r) - (a.r == null ? -1 : a.r));

  const accNote = log.length < 5 ? t("pr_gather") : Math.abs(acc - .78) < .12 ? t("pr_tuned")

    <h1>${t("pf_title")}</h1>

    <div class="grid g-2-1" style="margin-top:26px">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card">
          <div class="sec-title" style="margin-bottom:14px">${t("pf_cog")}</div>
          ${[["r_pattern", c.pattern], ["r_logic", c.logic], ["r_speed", c.speed], ["r_memory", c.memory]].map(([k, v]) => `
            <div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px">
                <span>${t(k)}</span><span class="mono mute">${v == null ? "—" : v}</span></div>
              <div class="bar"><div class="bar-fill" style="width:${v || 0}%"></div></div></div>`).join("")}
          <p class="hint">${t("pf_cog_note")}</p>
        </div>
        <div class="card">
          <div class="sec-title" style="margin-bottom:13px">${t("pf_subj")}</div>
          ${S.subjects.map(s => `<div style="margin-bottom:16px">
            <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
              <span style="font-weight:600;font-size:14.5px">${esc(s.name)}</span>
              ${s.tag ? `<span class="pill ${s.tag.charAt(0) === "P" && +s.tag.charAt(1) <= 3 ? "pill-peak" : "pill-low"}">${esc(s.tag)}</span>` : ""}
            </div>
            ${s.topics.map(tp => `<div class="kv" style="padding:7px 0">
              <span class="kv-k">${esc(tp.name)}</span>
              <span class="kv-v mono" style="font-size:13px">${tp.exam
                ? (daysUntil(tp.exam) < 0 ? t("pf_past") : t("pf_in", { n: daysUntil(tp.exam) })) : t("pf_nodate")}</span></div>`).join("")}
          </div>`).join("") || `<div class="empty">—</div>`}
          <button class="btn btn-ghost" data-act="editAbi" style="margin-top:8px">${t("pf_edit")}</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card">
          <div class="sec-title" style="margin-bottom:13px">${t("pf_how")}</div>
          ${blend.map(b => `<div style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px">
              <span>${t("mode_" + b.m)}</span><span class="mono mute">${pct(b.v)}%</span></div>
            <div class="bar"><div class="bar-fill" style="width:${pct(b.v)}%"></div></div></div>`).join("")}
        </div>
        <div class="card">
          <div class="sec-title" style="margin-bottom:11px">${t("pf_focus")}</div>
          <div class="kv"><span class="kv-k">${t("pf_span")}</span><span class="kv-v">${S.attention.span} min</span></div>
          <div class="kv"><span class="kv-k">${t("pf_over")}</span><span class="kv-v">${S.attention.overwhelm}/5</span></div>
          <div class="kv"><span class="kv-k">${t("pf_restart")}</span><span class="kv-v">${S.attention.restart}/5</span></div>
          <div class="kv"><span class="kv-k">${t("pf_nov")}</span><span class="kv-v">${S.attention.novelty}/5</span></div>
          <p class="hint">${t("pf_focus_note")}</p>
        </div>
        <div class="card">
          <div class="sec-title" style="margin-bottom:11px">${t("pf_woven")}</div>
          <div class="badge-row" style="margin-top:0">${S.person.interests.map(i =>
            `<span class="chip chip-sm sel">${esc(INTERESTS[i] ? L(INTERESTS[i].l) : i)}</span>`).join("")}</div>
          <div class="divider" style="margin:16px 0"></div>
          <div class="sec-title" style="margin-bottom:9px">${t("pf_goals")}</div>
          ${S.person.goals.map(g => {
            const go = GOALS.find(x => x.id === g);
            return `<div class="dim" style="font-size:13.5px;margin-bottom:5px">— ${esc(go ? L(go.l) : g)}</div>`;
          }).join("") || `<div class="mute" style="font-size:13.5px">${t("pf_nogoals")}</div>`}
        </div>
        <div class="card">
          <div class="sec-title" style="margin-bottom:11px">${t("pf_data")}</div>
          <p class="mute" style="font-size:13.2px;line-height:1.6">${t("pf_data_note")}</p>
          <div class="btn-row" style="margin-top:14px">
            <button class="btn btn-ghost" data-act="exportProfile">${t("pf_export")}</button>
            <button class="btn btn-quiet" data-act="resetAll">${t("pf_reset")}</button></div>
        </div>
      </div>
    </div>
  </div>`));
}
ACT.exportProfile = () => { Store.export(); toast(t("pf_downloaded")); };
ACT.resetAll = () => { if (!confirm(t("pf_reset_q"))) return; const l = LANG; Store.reset(); setLang(l); scrWelcome(); };
ACT.editAbi = () => { FLOW.abi = null; scrAbi(); };

/* 6.4 Session player ---------------------------------------- */
let SES = null;
function startSession(topicId) {
  const topic = getTopic(topicId);
  if (!topic) return;
  const r = Engine.rec(topicId);
  const n = Engine.microSteps(topicId);
  const steps = [];
  for (let i = 0; i < n; i++) steps.push((r.stepIdx + i) % topic.steps.length);
  SES = {
    topicId: topicId, topic: topic, steps: steps, pos: 0, phase: "teach",
    nPractice: clamp(Math.round(S.attention.span / 9), 2, 5), pDone: 0, correct: 0,
    lastWrong: false, m0: r.mastery, mode: null, t0: 0, flavor: Engine.flavor(), started: Date.now()
  };
  renderSession();
}
function renderSession() { stopTick(); if (SES.phase === "teach") renderTeach(); else renderPractice(); }
function pips() {
  const total = SES.steps.length + SES.nPractice;
  const cur = SES.phase === "teach" ? SES.pos : SES.steps.length + SES.pDone;
  return `<div class="step-pips">${Array.from({ length: total }, (_, i) =>
    `<span class="pip ${i < cur ? "done" : i === cur ? "on" : ""}"></span>`).join("")}</div>`;
}
function focusTop(label) {
  return `<div class="focus-top">
    <button class="btn btn-quiet" data-act="quitSession">${t("s_exit")}</button>
    ${pips()}
    <span class="mute" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:640">${label}</span>
  </div>`;
}
function renderTeach() {
  FLOW.redraw = renderTeach;
  const step = SES.topic.steps[SES.steps[SES.pos]];
  const mode = Engine.modality(SES.topicId);
  SES.mode = mode;
  mount(focusTop(esc(SES.topic.name)) + `<div class="focus-body"><div class="focus-card">
    <div class="micro-tag">${t("s_step", { mode: t("mode_" + mode), n: SES.pos + 1, t: SES.steps.length })}</div>
    <h2 style="margin-bottom:18px">${esc(step.t)}</h2>
    <div class="teach">${Engine.weave(step[mode] || step.textual, SES.flavor)}</div>
    <div class="btn-row">
      <button class="btn btn-primary" data-act="nextTeach">
        ${SES.pos + 1 < SES.steps.length ? t("s_next") : t("s_toq")}</button>
      <button class="btn btn-quiet" data-act="switchMode">${t("s_other")}</button>
    </div>
  </div></div>`, "focus-screen");
}
ACT.switchMode = () => {
  const r = Engine.rec(SES.topicId);
  r.lastMode = pick(MODES.filter(m => m !== SES.mode));
  SES.mode = r.lastMode;
  const step = SES.topic.steps[SES.steps[SES.pos]];
  const card = document.querySelector(".focus-card");
  if (!card) return;
  card.style.animation = "none";
  $(".micro-tag", card).textContent = t("s_step", { mode: t("mode_" + SES.mode), n: SES.pos + 1, t: SES.steps.length });
  $(".teach", card).innerHTML = Engine.weave(step[SES.mode] || step.textual, SES.flavor);
  requestAnimationFrame(() => { card.style.animation = "enter .35s var(--ease) both"; });
  S.style[SES.mode] += 0.4;
  Store.save();
};
ACT.nextTeach = () => {
  const r = Engine.rec(SES.topicId);
  r.stepIdx = (SES.steps[SES.pos] + 1) % SES.topic.steps.length;
  Store.save();
  const rw = Engine.reward({ stepDone: true });
  if (rw) showReward(rw);
  SES.pos++;
  if (SES.pos < SES.steps.length) renderTeach();
  else { SES.phase = "practice"; renderPractice(); }
};
function renderPractice() {
  stopTick(); FLOW.redraw = renderPractice;
  const picked = Engine.pickPractice(SES.topicId);
  if (!picked) { finishSession(); return; }
  SES.cur = picked.q; SES.t0 = Date.now();
  const p = Engine.pace(SES.topicId);
  mount(focusTop(t("s_practice")) + `<div class="focus-body"><div class="focus-card">
    <div class="micro-tag">${t("s_q", { n: SES.pDone + 1, t: SES.nPractice, d: picked.q.d.toFixed(2) })}</div>
    <div class="q-text">${Engine.weave(picked.q.q, SES.flavor)}</div>
    <div class="opts">${shuffle(picked.q.opts).map((o, i) =>
      `<button class="opt" data-act="ansPractice" data-v="${esc(o)}">
        <span class="opt-key">${"ABCD"[i]}</span><span>${Engine.weave(o, SES.flavor)}</span></button>`).join("")}</div>
    <p class="hint">${esc(paceWhy(p))}</p>
  </div></div>`, "focus-screen");
}
ACT.ansPractice = (el, d) => {
  const q = SES.cur, ms = Date.now() - SES.t0;
  const correct = d.v === q.a;
  FLOW.redraw = null;
  Engine.updateMastery(SES.topicId, correct, ms, q.d, SES.mode);
  if (correct) SES.correct++;
  document.querySelectorAll(".opt").forEach(o => {
    if (o.dataset.v === q.a) o.classList.add("correct");
    else if (o.dataset.v === d.v) o.classList.add("wrong");
    o.removeAttribute("data-act");
  });
  const card = document.querySelector(".focus-card");
  if (card && q.why) {
    const n = document.createElement("div");
    n.className = "card-2";
    n.style.cssText = "margin-top:18px;animation:fadeIn .35s;border-color:" +
      (correct ? "rgba(111,224,140,.3)" : "rgba(242,177,121,.32)");
    n.innerHTML = `<div style="font-size:14.5px;line-height:1.6">
      <strong style="color:${correct ? "var(--green)" : "var(--amber)"}">${correct ? t("s_correct") : t("s_wrong")}</strong>
      — ${Engine.weave(q.why, SES.flavor)}</div>`;
    card.appendChild(n);
  }
  const rw = Engine.reward({ correct: correct, comeback: correct && SES.lastWrong });
  if (rw) showReward(rw);
  SES.lastWrong = !correct;
  SES.pDone++;
  setTimeout(() => { if (SES.pDone < SES.nPractice) renderPractice(); else finishSession(); },
    correct ? 1500 : 2600);
};
const REWARD_TXT = {
  de: { small: ["Sauber.", "Genau das.", "Sitzt.", "Richtig.", "Scharf.", "Ja – das ist es."],
        step: ["Schritt geschafft.", "Das Stück gehört dir.", "Einer weniger."],
        comeback: ["Beim zweiten Anlauf getroffen – genau das bleibt hängen.", "Daneben, nachjustiert, getroffen. Das ist echtes Lernen.", "Erholt. Das zählt mehr als auf Anhieb richtig."],
        jackpot: ["⚡ Serienbonus!", "⚡ Dicker Treffer.", "⚡ Bonusrunde."],
        session: ["Einheit abgeschlossen.", "Block erledigt."] },
  en: { small: ["Clean.", "That's it.", "Locked in.", "Correct.", "Sharp.", "Yes — that's the one."],
        step: ["Step complete.", "That piece is yours.", "One down."],
        comeback: ["You got it on the second pass — that's the one that sticks.", "Missed, adjusted, landed. That's actual learning.", "Recovered. Worth more than getting it first time."],
        jackpot: ["⚡ Streak bonus!", "⚡ Big one.", "⚡ Bonus round."],
        session: ["Session complete.", "That's the block done."] },
  tr: { small: ["Temiz.", "İşte bu.", "Oturdu.", "Doğru.", "Keskin.", "Evet — bu."],
        step: ["Adım tamam.", "O parça senin.", "Bir tane bitti."],
        comeback: ["İkinci denemede tutturdun — kalıcı olan budur.", "Kaçırdın, ayarladın, tutturdun. Gerçek öğrenme bu.", "Toparladın. İlk seferde doğrudan daha değerli."],
        jackpot: ["⚡ Seri bonusu!", "⚡ Büyük vuruş.", "⚡ Bonus tur."],
        session: ["Oturum tamamlandı.", "Blok bitti."] }
};
function showReward(rw) {
  const bank = REWARD_TXT[LANG] || REWARD_TXT.de;
  const msg = pick(bank[rw.kind] || bank.small);
  const icon = rw.kind === "jackpot" ? "⚡" : rw.kind === "comeback" ? "↺" : "✦";
  toast(`<span>${icon}</span><span>${esc(msg)}</span><span class="reward-xp">+${rw.xp} XP</span>`,
    rw.kind === "comeback" ? 3400 : 2500);
  if (rw.levelled) setTimeout(() => toast(`<span>◆</span><span>${t("lvl_up", { n: S.level })}</span>`, 2800), 2700);
}
function finishSession() {
  stopTick(); FLOW.redraw = null;
  const r = Engine.rec(SES.topicId);
  const gain = r.mastery - SES.m0;
  const accy = SES.nPractice ? SES.correct / SES.nPractice : 0;
  const p = Engine.pace(SES.topicId);
  const mins = Math.max(1, Math.round((Date.now() - SES.started) / 60000));
  if (S.completedToday.indexOf(SES.topicId) === -1) S.completedToday.push(SES.topicId);
  const rw = Engine.reward({ sessionDone: true });
  Store.save();
  const nextT = Engine.schedule().filter(x => !x.done)[0];
  mount(`<div class="center-wrap"><div class="stage" style="text-align:center">
    <div style="font-size:34px;margin-bottom:8px">${gain > 0.04 ? "✦" : "✓"}</div>
    <h1>${esc(Engine.line("done"))}</h1>
    <p class="lede" style="margin:12px auto 0">${t("s_done_t", { topic: esc(SES.topic.name), n: mins })}</p>
    <div class="card" style="margin-top:26px;text-align:left">
      <div class="kv"><span class="kv-k">${t("s_right")}</span>
        <span class="kv-v">${t("s_of", { a: SES.correct, b: SES.nPractice })}</span></div>
      <div class="kv"><span class="kv-k">${t("s_mastery")}</span>
        <span class="kv-v">${pct(SES.m0)}% → <span style="color:${gain >= 0 ? "var(--teal)" : "var(--amber)"}">${pct(r.mastery)}%</span></span></div>
      <div class="kv"><span class="kv-k">${t("s_xp")}</span><span class="kv-v mono">+${rw ? rw.xp : 0}</span></div>
      <div class="kv"><span class="kv-k">${t("s_verdict")}</span><span class="kv-v">${t("pace_" + p.v)}</span></div>
    </div>
    <div class="card-2" style="margin-top:14px;text-align:left">
      <div class="sec-title" style="margin-bottom:8px">${t("s_whatnext")}</div>
      <p class="dim" style="font-size:14px;line-height:1.65;margin:0">${t("s_next_d", {
        why: esc(paceWhy(p)), d: Engine.targetDifficulty(SES.topicId).toFixed(2),
        extra: accy >= 0.9 ? t("s_up") : accy <= 0.4 ? t("s_down") : "" })}</p>
    </div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-primary" data-act="go" data-v="dash">${t("s_back")}</button>
      ${nextT ? `<button class="btn btn-ghost" data-act="openTopic" data-v="${esc(nextT.topic.id)}">
        ${t("s_nextt", { topic: esc(nextT.topic.name) })}</button>` : ""}
    </div>
  </div></div>`);
  SES = null;
}
ACT.quitSession = () => { Store.save(); SES = null; VIEW = "dash"; render(); };

/* ---------- 7. BOOT --------------------------------------- */
function boot() {
  const had = Store.load();
  if (S.lang && I18N[S.lang]) LANG = S.lang;
  else {
    const nav = (navigator.language || "de").slice(0, 2).toLowerCase();
    LANG = I18N[nav] ? nav : "de";
    S.lang = LANG;
  }
  document.documentElement.lang = LANG;
  const today = new Date().toDateString();
  if (S.lastActive && S.lastActive !== today) {
    const gap = Math.round((new Date(today) - new Date(S.lastActive)) / 864e5);
    S.streak = gap === 1 ? S.streak + 1 : 1;
    S.completedToday = [];
    S.lastActive = today;
    Store.save();
  } else if (!S.lastActive) { S.lastActive = today; Store.save(); }
  if (had && S.stage === "app") { VIEW = "dash"; render(); } else scrWelcome();
}
document.addEventListener("keydown", e => {
  const opts = document.querySelectorAll(".opt[data-act]");
  if (!opts.length) return;
  const i = "1234".indexOf(e.key) !== -1 ? "1234".indexOf(e.key)
          : "abcdABCD".indexOf(e.key) !== -1 ? "abcdABCD".indexOf(e.key) % 4 : -1;
  if (i >= 0 && opts[i]) opts[i].click();
});
boot();

</script>
