/* AI-generated lessons (Mathematik only). Generated once per topic+level by
   netlify/functions/lesson*.mts, cached server-side (Netlify Blobs) and here
   in localStorage under its own key, so a profile reset keeps them.
   getTopic() must stay synchronous – the engine calls it – so lessons are
   fetched *before* a session starts (openLesson) and read from AI_CACHE. */
const AI_KEY = "abitakt.lessons.v1";
const AI_TOPICS = ["analysis_integral", "analysis_exp", "stochastik_binom", "geometrie_ebenen", "geometrie_lage", "geometrie_abstand"];
let AI_CACHE = {};
function loadAiCache() {
  try { AI_CACHE = JSON.parse(localStorage.getItem(AI_KEY) || "{}") || {}; } catch (e) { AI_CACHE = {}; }
}
function saveAiCache() { try { localStorage.setItem(AI_KEY, JSON.stringify(AI_CACHE)); } catch (e) {} }
function mathLevel(topicId) {
  const s = S.subjects.find(x => x.topics.some(tp => tp.id === topicId));
  if (!s || s.id !== "s_mathe") return null;
  return (s.tag === "P1" || s.tag === "P2" || s.tag === "LF") ? "Leistungsfach" : "Basisfach";
}
function aiKey(topicId) { const lv = mathLevel(topicId); return lv ? topicId + "/" + lv : null; }
function hasContent(topicId) {
  if (TOPICS[topicId]) return true;
  if (!needsAi(topicId)) return false;
  return !!AI_CACHE[aiKey(topicId)] || aiAvailable();
}
function needsAi(topicId) { return !TOPICS[topicId] && AI_TOPICS.indexOf(topicId) !== -1 && !!mathLevel(topicId); }

function getTopic(id) {
  if (TOPICS[id]) return TOPICS[id];
  const k = needsAi(id) ? aiKey(id) : null;
  if (k && AI_CACHE[k]) return AI_CACHE[k];
  const found = S.subjects.flatMap(s => s.topics.map(t => ({ t: t, s: s }))).find(x => x.t.id === id);
  return found ? genericTopic(found.t.name, found.s.name) : null;
}

/* ---------- 4. ADAPTIVE ENGINE ---------------------------
   This is the part that is genuinely "adaptive" — not scripted.
   Every function here reads live learner state and returns a decision.
   --------------------------------------------------------- */
const BLOCKS = [6, 8, 10, 12, 14, 16, 18, 20];
const MODES = ["visual", "auditory", "kinesthetic", "textual"];
const STEEP = 4;               // logistic steepness of the success curve
const IDEAL_SUCCESS = 0.78;    // zone of proximal development target

const Engine = {

  /* -- progress record accessor -- */
  rec(topicId) {
    if (!S.progress[topicId]) {
      S.progress[topicId] = {
        mastery: 0.08, attempts: 0, correct: 0, avgMs: 9000,
        modality: { visual: [0, 0], auditory: [0, 0], kinesthetic: [0, 0], textual: [0, 0] },
        recent: [], seen: [], stepIdx: 0, lastMode: null
      };
    }
    return S.progress[topicId];
  },

  /* -- 4.1 Mastery update.
     Elo-style: move toward the surprise. Learning rate decays with
     experience so early evidence counts more than the hundredth attempt. -- */
  updateMastery(topicId, correct, ms, difficulty, mode) {
    const r = this.rec(topicId);
    const expected = sigmoid((r.mastery - difficulty) * STEEP);
    const K = 0.30 / (1 + r.attempts * 0.11);
    let delta = K * ((correct ? 1 : 0) - expected);

    // fast + correct is stronger evidence of mastery than slow + correct
    if (correct && ms < r.avgMs * 0.65) delta *= 1.22;
    // slow + correct suggests reconstruction, not recall
    if (correct && ms > r.avgMs * 1.8) delta *= 0.75;

    r.mastery = clamp(r.mastery + delta, 0, 0.995);
    r.attempts++;
    if (correct) r.correct++;
    r.avgMs = r.attempts === 1 ? ms : r.avgMs * 0.75 + ms * 0.25;
    r.recent.push({ c: correct ? 1 : 0, ms: ms });
    if (r.recent.length > 6) r.recent.shift();

    if (mode && r.modality[mode]) {
      r.modality[mode][0] += correct ? 1 : 0;
      r.modality[mode][1] += 1;
    }
    S.log.push({ t: Date.now(), topicId: topicId, correct: !!correct, ms: ms, d: difficulty });
    if (S.log.length > 400) S.log.shift();
    Store.save();
    return delta;
  },

  /* -- 4.2 Target difficulty (ZPD).
     Solve sigmoid((m − d)·k) = target for d, then shift the target
     according to live state: tired or overwhelmed → aim easier;
     on a hot streak → aim harder. -- */
  targetDifficulty(topicId) {
    const r = this.rec(topicId);
    let target = IDEAL_SUCCESS;
    const e = this.energyNow();
    if (e <= 2) target += 0.07;                       // low energy → easier
    if (S.attention.overwhelm >= 4) target += 0.05;   // overwhelm-prone → easier
    if (S.attention.span < 15) target += 0.03;

    const last3 = r.recent.slice(-3);
    if (last3.length === 3 && last3.every(x => x.c)) target -= 0.09;      // flowing → push
    if (last3.length >= 2 && last3.slice(-2).every(x => !x.c)) target += 0.10; // struggling → catch them

    target = clamp(target, 0.55, 0.93);
    const d = r.mastery - Math.log(target / (1 - target)) / STEEP;
    return clamp(d, 0.05, 0.95);
  },

  /* -- 4.3 Question selection: nearest unseen item to target difficulty -- */
  pickPractice(topicId) {
    const topic = getTopic(topicId);
    if (!topic) return null;
    const r = this.rec(topicId);
    const target = this.targetDifficulty(topicId);
    let pool = topic.practice.filter(q => !r.seen.includes(q.q));
    if (!pool.length) { r.seen = []; pool = topic.practice; }
    pool = pool.slice().sort((a, b) => Math.abs(a.d - target) - Math.abs(b.d - target));
    const q = pool[0];
    r.seen.push(q.q);
    return { q: q, target: target };
  },

  /* -- 4.4 Pacing verdict from the rolling window -- */
  pace(topicId) {
    const r = this.rec(topicId);
    const w = r.recent.slice(-5);
    if (w.length < 3) return { v: "hold", why: "pace_why_cal" };
    const acc = mean(w.map(x => x.c));
    const speed = mean(w.map(x => x.ms)) / Math.max(r.avgMs, 1);
    if (acc >= 0.8 && speed < 0.95) return { v: "accelerate", why: "pace_why_acc" };
    if (acc <= 0.4) return { v: "decompose", why: "pace_why_dec" };
    if (speed > 1.65) return { v: "decompose", why: "pace_why_slow" };
    return { v: "hold", why: "pace_why_hold" };
  },

  /* -- 4.5 How many micro-steps fit this session?
     Driven by attention span, topic cognitive load, and current energy. -- */
  microSteps(topicId) {
    const topic = getTopic(topicId);
    if (!topic) return 1;
    const perStep = 2.2 + topic.load * 0.55;
    let n = S.attention.span / perStep;
    const e = this.energyNow();
    n *= (0.62 + e * 0.115);                       // 1→0.74x  5→1.20x
    if (S.attention.overwhelm >= 4) n *= 0.78;
    if (this.pace(topicId).v === "accelerate") n *= 1.3;
    if (this.pace(topicId).v === "decompose") n *= 0.7;
    return clamp(Math.round(n), 1, topic.steps.length);
  },

  /* -- 4.6 Modality choice.
     Blend of stated preference and observed performance, with
     ε-exploration so the profile keeps being tested, plus a novelty
     penalty for learners who burn out on repetition. -- */
  modality(topicId) {
    const r = this.rec(topicId);
    const tot = sum(MODES.map(m => S.style[m])) || 1;
    const scored = MODES.map(m => {
      const stated = S.style[m] / tot;
      const [c, n] = r.modality[m];
      const observed = n >= 2 ? c / n : null;
      // shrink observed toward stated until there's real evidence
      const w = observed === null ? stated : stated * 0.55 + observed * 0.45;
      const novelty = (m === r.lastMode) ? (1 - (S.attention.novelty - 1) * 0.16) : 1;
      return { m: m, s: Math.max(w * novelty, 0.02) };
    });
    let chosen;
    if (Math.random() < 0.15) {                    // explore
      chosen = pick(MODES);
    } else {                                        // exploit (roulette)
      const total = sum(scored.map(x => x.s));
      let t = Math.random() * total;
      chosen = scored[scored.length - 1].m;
      for (const x of scored) { t -= x.s; if (t <= 0) { chosen = x.m; break; } }
    }
    r.lastMode = chosen;
    return chosen;
  },

  /* -- 4.7 Variable-ratio reward scheduler.
     Fixed rewards stop working — the brain prices them in. This uses a
     variable schedule with guaranteed moments at psychologically
     important points (recovery after failure, session completion). -- */
  reward(ctx) {
    const rs = S.rewardState;
    rs.sinceLast++;
    let fire = false, kind = "small", xp = 10;

    if (ctx.comeback) { fire = true; kind = "comeback"; xp = 22; }
    else if (ctx.stepDone) { fire = true; kind = "step"; xp = 15; }
    else if (ctx.sessionDone) { fire = true; kind = "session"; xp = 45; }
    else if (ctx.correct) {
      let p = 0.34 + rs.sinceLast * 0.13;           // pressure builds → feels unpredictable, never punishing
      if (S.attention.novelty >= 4) p += 0.08;
      if (Math.random() < p) { fire = true; kind = "small"; xp = 8 + Math.floor(Math.random() * 8); }
      if (Math.random() < 0.022) { fire = true; kind = "jackpot"; xp = 40 + Math.floor(Math.random() * 25); }
    }
    if (!fire) return null;
    rs.sinceLast = 0;

    const bank = {
      small: ["Clean.", "That's it.", "Locked in.", "Correct.", "Sharp.", "Yes — that's the one."],
      step:  ["Step complete.", "That piece is yours.", "One down."],
      comeback: ["You got it on the second pass — that's the one that sticks.",
                 "Missed, adjusted, landed. That's actual learning.",
                 "Recovered. That's worth more than getting it first time."],
      jackpot: ["⚡ Streak bonus!", "⚡ Big one.", "⚡ Bonus round."],
      session: ["Session complete.", "That's the block done."]
    };
    let msg = pick(bank[kind]);
    if (kind === rs.lastKind && kind === "small") msg = pick(bank.small);
    rs.lastKind = kind;

    S.xp += xp;
    const newLevel = Math.floor(Math.sqrt(S.xp / 45)) + 1;
    let levelled = false;
    if (newLevel > S.level) { S.level = newLevel; levelled = true; }
    Store.save();
    return { msg: msg, xp: xp, kind: kind, levelled: levelled };
  },

  /* -- 4.8 Chronobiology -- */
  blockFor(hour) {
    let best = BLOCKS[0];
    for (const b of BLOCKS) if (hour >= b) best = b;
    return best;
  },
  energyAt(hour) { const v = S.energy[this.blockFor(hour)]; return v == null ? 3 : v; },
  energyNow() { return this.energyAt(new Date().getHours()); },
  peakBlocks() {
    const vals = BLOCKS.map(b => ({ b: b, v: S.energy[b] == null ? 3 : S.energy[b] }));
    const top = Math.max.apply(null, vals.map(x => x.v));
    return vals.filter(x => x.v === top).map(x => x.b);
  },

  /* -- 4.9 Daily schedule.
     Rank topics by urgency × mastery gap, rank time blocks by energy,
     then match heaviest cognitive load to highest energy. -- */
  allTopics() {
    const out = [];
    S.subjects.forEach(s => s.topics.forEach(t => {
      const known = TOPICS[t.id];
      out.push({
        id: t.id, name: t.name, subject: s.name,
        load: known ? known.load : 3, exam: t.exam,
        mastery: this.rec(t.id).mastery,
        steps: known ? known.steps.length : 5
      });
    }));
    return out;
  },
  priority(t) {
    const d = daysUntil(t.exam);
    let urgency = 0.28;
    if (d !== null) urgency = d <= 0 ? 1 : clamp(1 / (1 + d / 6), 0.2, 1);
    const gap = 1 - t.mastery;
    return urgency * 0.54 + gap * 0.46;
  },
  schedule() {
    const topics = this.allTopics();
    if (!topics.length) return [];
    const ranked = topics.map(t => ({ t: t, p: this.priority(t) })).sort((a, b) => b.p - a.p);

    const nowH = new Date().getHours();
    let blocks = BLOCKS.filter(b => b + 2 > nowH)
      .map(b => ({ h: b, e: S.energy[b] == null ? 3 : S.energy[b] }));
    if (!blocks.length) blocks = BLOCKS.map(b => ({ h: b, e: S.energy[b] == null ? 3 : S.energy[b] }));

    // how much can this person realistically do today?
    let capacity = clamp(Math.round(S.attention.span / 11) + 1, 2, 5);
    capacity = Math.min(capacity, blocks.length, ranked.length);

    // heaviest cognitive demand → highest energy block
    const byDemand = ranked.slice(0, capacity)
      .map(x => ({ x: x, demand: x.p * 0.5 + (x.t.load / 5) * 0.5 }))
      .sort((a, b) => b.demand - a.demand);
    const byEnergy = blocks.slice().sort((a, b) => b.e - a.e);

    const peak = this.peakBlocks();
    const plan = byDemand.map((d, i) => {
      const blk = byEnergy[i];
      return {
        hour: blk.h, energy: blk.e, topic: d.x.t, priority: d.x.p,
        peak: peak.indexOf(blk.h) !== -1,
        mins: clamp(Math.round(S.attention.span * (0.7 + d.x.t.load * 0.09)), 8, 55),
        done: S.completedToday.indexOf(d.x.t.id) !== -1
      };
    });
    return plan.sort((a, b) => a.hour - b.hour);
  },

  /* -- 4.10 Interest weaving (flavour source is set in section 5) -- */
  weave(text, f) {
    f = f || this.flavor();
    return String(text)
      .replace(/\{scen\}/g, f.scen).replace(/\{objA\}/g, f.objA || f.obj).replace(/\{obj\}/g, f.obj)
      .replace(/\{unit\}/g, f.unit).replace(/\{who\}/g, f.who)
      .replace(/\{Who\}/g, f.who.charAt(0).toUpperCase() + f.who.slice(1));
  },

  /* -- 4.11 Cognitive composite -- */
  composite() {
    const c = S.cog;
    const parts = [c.pattern, c.logic, c.speed, c.memory].filter(x => x != null);
    if (!parts.length) return null;
    return Math.round(mean(parts));
  },
  dominantStyle() {
    let best = "visual", bv = -1;
    MODES.forEach(m => { if (S.style[m] > bv) { bv = S.style[m]; best = m; } });
    return best;
  },
  styleBlend() {
    const tot = sum(MODES.map(m => S.style[m])) || 1;
    return MODES.map(m => ({ m: m, v: S.style[m] / tot })).sort((a, b) => b.v - a.v);
  },

};

/* 5.2 Choice quiz (pattern + logic) -------------------------- */
function runChoiceQuiz(cfg) {
  FLOW.qz = { i: 0, items: cfg.items, ans: [], t0: 0, cfg: cfg };
  renderChoiceQ();
}
function renderChoiceQ() {
  stopTick();
  const z = FLOW.qz, it = z.items[z.i];
  FLOW.redraw = renderChoiceQ;
  z.t0 = Date.now();
  let left = z.cfg.limit;
  const opts = it.seq ? it.opts : L(it.opts);
  const answer = it.seq ? it.a : L(it.opts)[it.ai];
  z.answer = answer;

  const body = it.seq
    ? `<div class="q-text">${t("q_next")}</div>
       <div class="seq">${it.seq.map((v, i) =>
         `<div class="seq-cell" style="animation-delay:${i * 55}ms">${esc(v)}</div>`).join("")}
         <div class="seq-cell q" style="animation-delay:${it.seq.length * 55}ms">?</div></div>`
    : `<div class="q-text">${L(it.q)}</div>`;

  mount(rail(z.cfg.step) + `<div class="center-wrap"><div class="stage">
    <div class="assess-head">
      <div><div class="eyebrow">${t(z.cfg.titleKey)}</div>
        <div class="q-num" style="margin-top:5px">${t("q_of", { n: z.i + 1, t: z.items.length })}</div></div>
      <div class="timer-ring"><svg width="44" height="44">
        <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"/>
        <circle id="ring" cx="22" cy="22" r="18" fill="none" stroke="var(--accent)" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="0"/></svg>
        <span id="ringtxt" class="mute">${left}</span></div>
    </div>
    ${body}
    <div class="opts">${shuffle(opts).map((o, i) =>
      `<button class="opt" data-act="ansChoice" data-v="${esc(o)}">
        <span class="opt-key">${"ABCD"[i]}</span><span>${o}</span></button>`).join("")}</div>
  </div></div>`);

  TICK = setInterval(() => {
    left--;
    const ring = document.getElementById("ring"), txt = document.getElementById("ringtxt");
    if (!ring) { stopTick(); return; }
    ring.setAttribute("stroke-dashoffset", String(113 * (1 - left / z.cfg.limit)));
    txt.textContent = String(Math.max(left, 0));
    if (left <= 5) { ring.setAttribute("stroke", "var(--amber)"); txt.className = ""; }
    if (left <= 0) { stopTick(); ACT.ansChoice(null, { v: "__timeout__" }); }
  }, 1000);
}
ACT.ansChoice = (el, d) => {
  stopTick();
  const z = FLOW.qz, it = z.items[z.i];
  const ms = Date.now() - z.t0;
  const correct = d.v === z.answer;
  z.ans.push({ correct: correct, ms: ms, d: it.d });
  FLOW.redraw = null;

  document.querySelectorAll(".opt").forEach(o => {
    if (o.dataset.v === z.answer) o.classList.add("correct");
    else if (o.dataset.v === d.v) o.classList.add("wrong");
    o.removeAttribute("data-act");
  });
  const stage = document.querySelector(".stage");
  if (stage && it.why) {
    const n = document.createElement("p");
    n.className = "hint";
    n.style.cssText = "margin-top:16px;animation:fadeIn .3s";
    n.innerHTML = (correct ? "✓ " : "→ ") + esc(L(it.why));
    stage.appendChild(n);
  }
  setTimeout(() => {
    z.i++;
    if (z.i < z.items.length) renderChoiceQ(); else z.cfg.done(z.ans);
  }, correct ? 900 : 1900);
};
function weightedScore(ans) {
  const max = sum(ans.map(a => 0.5 + a.d));
  const got = sum(ans.map(a => a.correct ? 0.5 + a.d : 0));
  return Math.round(clamp(got / max, 0, 1) * 100);
}
ACT.startPattern = () => runChoiceQuiz({

  done: ans => { S.cog.pattern = weightedScore(ans); Store.save(); startLogic(); }
});
function startLogic() {
  runChoiceQuiz({

    done: ans => { S.cog.logic = weightedScore(ans); Store.save(); scrSpeedIntro(); }

}

  mount(rail(4) + `<div class="center-wrap"><div class="stage" style="text-align:center">

ACT.ansSpeed = (el, d) => {
  const s = FLOW.sp, it = s.items[s.i];
  s.res.push({ correct: d.v === it.a, ms: Date.now() - s.t0 });
  s.i++;
  if (s.i < s.items.length) renderSpeed();
  else {
    const acc = mean(s.res.map(r => r.correct ? 1 : 0));
    const times = s.res.filter(r => r.correct).map(r => r.ms).sort((a, b) => a - b);
    const med = times.length ? times[Math.floor(times.length / 2)] : 4000;
    const speedPts = clamp(100 - (med - 800) / 26, 5, 100);
    S.cog.speed = Math.round(clamp(speedPts * 0.62 + acc * 100 * 0.38, 0, 100));
    Store.save(); scrMemoryIntro();
  }
};

/* 6.0 Exam readiness ------------------------------------------
   Read-only view on engine state. readiness = mastery × freshness.
   Freshness halves every 21 days without practice (floor 0.35) – a
   deliberately simple forgetting heuristic, not a fitted model.
   Exam urgency is NOT part of the score (a near exam doesn't make you
   more ready); it only decides the order of the "close next" list. */
const Readiness = {
  HALF_LIFE_DAYS: 21,
  daysSince(topicId) {
    const ts = S.lastPractice[topicId];
    return ts ? Math.floor((Date.now() - ts) / 864e5) : null;
  },
  freshness(topicId) {
    const d = this.daysSince(topicId);
    if (d === null) return 0;
    return Math.max(0.35, Math.pow(0.5, d / this.HALF_LIFE_DAYS));
  },
  topic(topicId) {
    const r = S.progress[topicId];
    if (!r || !r.attempts) return 0;
    return clamp(r.mastery * this.freshness(topicId), 0, 1);
  },
  subject(s) {
    return s.topics.length ? mean(s.topics.map(tp => this.topic(tp.id))) : 0;
  },
  level(v) { return v >= 0.7 ? "high" : v >= 0.4 ? "mid" : "low"; },
  gaps(n) {
    const all = [];
    S.subjects.forEach(s => s.topics.forEach(tp => {
      const d = daysUntil(tp.exam);
      all.push({ id: tp.id, name: tp.name, subject: s.name, r: this.topic(tp.id), days: d == null ? 999 : d });
    }));
    return all.filter(x => x.days >= 0)
      .sort((a, b) => (a.r - b.r) || (a.days - b.days)).slice(0, n);
  }
};

}

const LESSON_API = "/api/lesson";
let LOADING = null;
const ALLOWED_TAGS = new Set(["p", "strong", "em", "b", "i", "br", "ul", "ol", "li", "div", "span", "sub", "sup",
  "table", "thead", "tbody", "tr", "td", "th", "code", "svg", "g", "path", "line", "rect", "circle", "ellipse",
  "polyline", "polygon", "text", "tspan", "defs", "marker"]);
const ALLOWED_ATTRS = new Set(["class", "style", "viewbox", "width", "height", "x", "y", "x1", "y1", "x2", "y2",
  "cx", "cy", "r", "rx", "ry", "d", "points", "fill", "stroke", "stroke-width", "stroke-dasharray", "stroke-linecap",
  "stroke-linejoin", "opacity", "fill-opacity", "transform", "text-anchor", "dominant-baseline", "font-size",
  "font-weight", "font-family", "marker-end", "marker-start", "id", "refx", "refy", "markerwidth", "markerheight",
  "orient", "xmlns", "preserveaspectratio", "dx", "dy", "role", "aria-label"]);
const ALLOWED_CLASSES = ["visual-box", "kinetic-box", "audio-box", "mono"];
/* defence in depth: the server validates too, but lesson HTML is rendered with innerHTML */
function cleanHtml(html) {
  const doc = new DOMParser().parseFromString("<div>" + String(html) + "</div>", "text/html");
  const walk = node => {
    Array.from(node.children).forEach(el => {
      const tag = el.tagName.toLowerCase();
      if (!ALLOWED_TAGS.has(tag)) { el.remove(); return; }
      Array.from(el.attributes).forEach(a => {
        const n = a.name.toLowerCase(), v = a.value;
        if (!ALLOWED_ATTRS.has(n) || /url\s*\(|javascript:|expression\s*\(/i.test(v)) el.removeAttribute(a.name);
        else if (n === "class") el.setAttribute("class", v.split(/\s+/).filter(c => ALLOWED_CLASSES.indexOf(c) !== -1).join(" "));
      });
      walk(el);
    });
  };
  const root = doc.body.firstChild;
  walk(root);
  return root.innerHTML;
}
function acceptLesson(x, topicId) {
  if (!x || !Array.isArray(x.steps) || x.steps.length < 4 || x.steps.length > 5) return null;
  if (!Array.isArray(x.practice) || x.practice.length !== 9) return null;
  const steps = [];
  for (const st of x.steps) {
    const o = { t: String(st.t || "") };
    for (const m of MODES) { o[m] = cleanHtml(st[m] || ""); if (!o[m].replace(/<[^>]*>/g, "").trim()) return null; }
    if (!o.t) return null;
    steps.push(o);
  }
  const practice = [];
  for (const q of x.practice) {
    if (!Array.isArray(q.opts) || q.opts.length !== 4 || new Set(q.opts).size !== 4 || q.opts.indexOf(q.a) === -1) return null;
    if (typeof q.d !== "number" || q.d < 0 || q.d > 1) return null;
    const wrong = {};
    Object.keys(q.wrong || {}).forEach(k => { if (q.opts.indexOf(k) !== -1 && k !== q.a) wrong[k] = cleanHtml(q.wrong[k]); });
    practice.push({ d: q.d, op: String(q.op || ""), q: cleanHtml(q.q), opts: q.opts.map(String), a: String(q.a),
      why: cleanHtml(q.why || ""), wrong: wrong });
  }
  return { subject: "Mathematik", name: topicName(topicId), load: clamp(Math.round((+x.load || 5) / 2), 1, 5),
    ai: true, level: x.level || null, steps: steps, practice: practice };
}
function aiAvailable() { return /^https?:$/.test(location.protocol) && navigator.onLine !== false; }
async function lessonCall(method, topicId, level) {
  const url = method === "GET" ? `${LESSON_API}?topicId=${encodeURIComponent(topicId)}&level=${encodeURIComponent(level)}` : LESSON_API;
  const res = await fetch(url, method === "GET" ? { cache: "no-store" } : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ topicId: topicId, level: level }) });
  let body = {};
  try { body = await res.json(); } catch (e) {}
  if (res.status === 429) return { status: "budget" };
  if (!res.ok && res.status !== 202) return { status: "failed" };
  return body;
}
async function openLesson(topicId) {
  if (!needsAi(topicId) || AI_CACHE[aiKey(topicId)] || !aiAvailable()) return startSession(topicId);
  const level = mathLevel(topicId), key = aiKey(topicId);
  const token = LOADING = { topicId: topicId, t0: Date.now() };
  renderLessonLoading(topicId);
  let r;
  try {
    r = await lessonCall("POST", topicId, level);
    while (LOADING === token && r.status === "pending" && Date.now() - token.t0 < 5 * 60 * 1000) {
      await new Promise(res => setTimeout(res, 5000));
      if (LOADING !== token) return;
      r = await lessonCall("GET", topicId, level);
      if (r.status === "none") r = await lessonCall("POST", topicId, level);
    }
  } catch (e) { r = { status: "failed" }; }
  if (LOADING !== token) return;            // user left the loading screen
  LOADING = null;
  const lesson = r && r.status === "ready" ? acceptLesson(r.lesson, topicId) : null;
  if (lesson) { AI_CACHE[key] = lesson; saveAiCache(); }
  else toast(`<span>○</span><span>${esc(t(r && r.status === "budget" ? "ai_budget" : "ai_failed"))}</span>`, 4200);
  startSession(topicId);
}

    exp: "Ergebnisoffen feststellen, ob eine vorgegebene Aussage stimmt – mit Rechnung oder Regeln.",

const OP_SOURCE = "https://www.bildungsplaene-bw.de/,Lde/BP2016BW_ALLG_GYM_M_OP";
const opLabel = o => o.op + (o.alias ? " / " + o.alias : "");

function buildOpQuiz(n) {
  const qs = [];
  // prefer operators the learner got wrong before
  const weight = o => { const st = S.opStats[o.op]; return st ? 1 + (st[1] - st[0]) : 1.5; };
  const pool = shuffle(OPERATORS).sort((a, b) => weight(b) - weight(a)).slice(0, n);
  pool.forEach((o, i) => {
    const others = shuffle(OPERATORS.filter(x => x.g !== o.g)).slice(0, 3);
    if (i % 2 === 0) {
      qs.push({ o: o, kind: "expect", q: o.ex, a: o.exp, opts: shuffle([o.exp].concat(others.map(x => x.exp))) });
    } else {
      qs.push({ o: o, kind: "name", q: o.def, a: opLabel(o), opts: shuffle([opLabel(o)].concat(others.map(opLabel))) });
    }
  });
  return qs;
}

function scrOperators() {
  const weak = OPERATORS.filter(o => { const st = S.opStats[o.op]; return st && st[0] < st[1]; });
  const group = afb => OPERATORS.filter(o => o.afb === afb).map(o => `
    <div class="kv" style="align-items:flex-start;gap:6px 16px;padding:12px 0;flex-wrap:wrap">
      <span class="kv-k" style="flex:0 0 150px;color:var(--tx);font-weight:600">${esc(opLabel(o))}</span>
      <span style="flex:1 1 240px;font-size:14px;line-height:1.55;color:var(--tx-dim)">${esc(o.exp)}
        <span class="mute" style="display:block;font-size:12.5px;margin-top:4px">${t("op_example")}: „${esc(o.ex)}“</span></span>
    </div>`).join("");
  mount(chrome(`<div class="dash stage-wide">
    <h1>${t("op_title")}</h1>
    <p class="lede" style="margin-top:8px">${t("op_lede")}</p>
    <div class="btn-row" style="margin-top:20px">
      <button class="btn btn-primary" data-act="opStart">${t("op_practice")}</button>
      ${weak.length ? `<span class="mute" style="font-size:13px">${t("op_weak", { n: weak.length })}</span>` : ""}
    </div>
    ${[1, 2, 3].map(a => `<div class="card" style="margin-top:16px">
      <div class="sec-title" style="margin-bottom:6px">${t("op_afb" + a)}</div>
      <p class="hint" style="margin:0 0 6px">${t("op_afb" + a + "_d")}</p>
      ${group(a)}
    </div>`).join("")}
    <p class="hint" style="margin-top:16px">${t("op_source")} <a href="${OP_SOURCE}" target="_blank" rel="noopener" style="color:var(--teal)">bildungsplaene-bw.de</a></p>
  </div>`));
}
ACT.opStart = () => { FLOW.op = { qs: buildOpQuiz(8), i: 0, right: 0 }; renderOpQ(); };
function renderOpQ() {
  stopTick();
  const z = FLOW.op, q = z.qs[z.i];
  mount(`<div class="focus-top">
      <button class="btn btn-quiet" data-act="opExit">${t("s_exit")}</button>
      <div class="step-pips">${z.qs.map((_, i) => `<span class="pip ${i < z.i ? "done" : i === z.i ? "on" : ""}"></span>`).join("")}</div>
      <span class="mute" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:640">${t("nav_ops")}</span>
    </div>
    <div class="focus-body"><div class="focus-card">
      <div class="micro-tag">${t(q.kind === "expect" ? "op_q_expect" : "op_q_name")} · ${t("q_of", { n: z.i + 1, t: z.qs.length })}</div>
      <div class="q-text">${q.kind === "expect" ? "„" + esc(q.q) + "“" : esc(q.q)}</div>
      <div class="opts">${q.opts.map((o, i) => `<button class="opt" data-act="opAns" data-v="${esc(o)}">
        <span class="opt-key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    </div></div>`, "focus-screen");
}
ACT.opAns = (el, d) => {
  const z = FLOW.op, q = z.qs[z.i];
  const correct = d.v === q.a;
  const st = S.opStats[q.o.op] || [0, 0];
  st[0] += correct ? 1 : 0; st[1] += 1;
  S.opStats[q.o.op] = st;
  Store.save();
  if (correct) z.right++;
  document.querySelectorAll(".opt").forEach(o => {
    if (o.dataset.v === q.a) o.classList.add("correct");
    else if (o.dataset.v === d.v) o.classList.add("wrong");
    o.removeAttribute("data-act");
  });
  const card = document.querySelector(".focus-card");
  if (card) {
    const n = document.createElement("div");
    n.className = "card-2";
    n.style.cssText = "margin-top:18px;animation:fadeIn .35s";
    n.innerHTML = `<div style="font-size:14.5px;line-height:1.6"><strong style="color:${correct ? "var(--green)" : "var(--amber)"}">${correct ? t("s_correct") : t("s_wrong")}</strong>
      — <strong>${esc(opLabel(q.o))}</strong> (AFB ${"I".repeat(q.o.afb)}): ${esc(q.o.exp)}</div>`;
    card.appendChild(n);
  }
  setTimeout(() => {
    z.i++;
    if (z.i < z.qs.length) renderOpQ(); else scrOpDone();
  }, correct ? 1400 : 3000);
};
function scrOpDone() {
  const z = FLOW.op;
  mount(`<div class="center-wrap"><div class="stage" style="text-align:center">
    <div style="font-size:34px;margin-bottom:8px">${z.right / z.qs.length >= 0.75 ? "✦" : "✓"}</div>
    <h1>${t("op_result", { a: z.right, b: z.qs.length })}</h1>
    <p class="lede" style="margin:12px auto 0">${t("op_result_t")}</p>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-primary" data-act="opStart">${t("op_again")}</button>
      <button class="btn btn-ghost" data-act="opExit">${t("op_back")}</button>
    </div>
  </div></div>`);
}

/* ---------- 6.6 COACH – personal planning layer ---------------
   Knows the learner's week (timetable, study windows), goals, exams,
   homework and behaviour, and turns that into ONE concrete next step
   with a reason ("heute 30 Min X, weil …").
   Reads Engine results; never changes Engine or its constants.
   Everything is stored locally in S.life.
   Observations are usage statistics, never a diagnosis. */
const LIFE_DEFAULT = () => ({
  setupDone: false,
  goals: { avg: "", study: "", why: "", subjectTargets: {} },   // subjectTargets: subjectId -> points 0..15
  habits: { procrastination: 3, prefLen: 25, phone: 3, place: "", starter: "" },
  timetable: [],        // {id, day 0..6 (Mo..So), from "08:00", to "09:30", label, kind: "school"|"other"}
  windows: [],          // {day, enabled, from, to}
  budget: 60, breakMins: 10,
  events: [],           // {id, type, subjectId, title, date, topics:[ids], done}
  tasks: [],            // {id, title, subjectId, due, minutes, done, spent}
  curriculum: {},       // topicId -> "now" | "later" | "done"
  checkins: {},         // "YYYY-MM-DD" -> {energy 1..5, barrier}
  sessions: [],         // {id, at, day, hour, kind, ref, topicId, planned, minutes, done, correct, answered, rating, delay}
  planLog: {},          // "YYYY-MM-DD" -> [{key, subjectId}] snapshot of what was planned
  notes: []             // {id, at, ref, text}
});
const EVENT_TYPES = ["klausur", "test", "abi", "gfs", "abgabe"];
const EVENT_WEIGHT = { klausur: 1, test: .7, abi: 1.2, gfs: .8, abgabe: .6 };

function isoDay(d) { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function weekday(d) { return ((d || new Date()).getDay() + 6) % 7; }        // 0 = Monday
function toMin(v) { if (!/^\d{1,2}:\d{2}$/.test(v || "")) return NaN; const p = v.split(":").map(Number); return p[0] < 24 && p[1] < 60 ? p[0] * 60 + p[1] : NaN; }
function toClock(m) { m = Math.round(m); return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
function fmtDate(iso, opts) {
  if (!iso) return "";
  const loc = LANG === "de" ? "de-DE" : LANG === "tr" ? "tr-TR" : "en-GB";
  return new Date(iso + "T12:00:00").toLocaleDateString(loc, opts || { weekday: "short", day: "numeric", month: "short" });
}
function relDays(n) { return n === 0 ? t("co_today") : n === 1 ? t("co_tomorrow") : n < 0 ? t("co_overdue") : t("co_in_days", { n: n }); }
const uidL = () => (crypto.randomUUID ? crypto.randomUUID() : uid() + uid());
function dayNames() { return t("co_days").split("|"); }
function subjectName(id) { const s = S.subjects.find(x => x.id === id); return s ? s.name : ""; }

const Coach = {
  active: null,            // running planned item {key, kind, ...}
  lastSession: null,

  life() {
    if (!S.life || typeof S.life !== "object") S.life = LIFE_DEFAULT();
    const base = LIFE_DEFAULT();
    Object.keys(base).forEach(k => { if (S.life[k] == null) S.life[k] = base[k]; });
    ["goals", "habits"].forEach(k => Object.keys(base[k]).forEach(j => { if (S.life[k][j] == null) S.life[k][j] = base[k][j]; }));
    return S.life;
  },
  configured() { const l = this.life(); return l.windows.some(w => w.enabled); },
  checkin(date) { return this.life().checkins[isoDay(date)] || null; },

  /* -- observations (only from real usage) -- */
  recent(days) { const since = Date.now() - (days || 30) * 864e5; return this.life().sessions.filter(s => s.at >= since); },
  stats() {
    const rows = this.recent(30), done = rows.filter(s => s.done);
    const mins = done.map(s => s.minutes).sort((a, b) => a - b);
    const median = mins.length ? mins[Math.floor(mins.length / 2)] : null;
    const last6 = rows.slice(-6);
    const abandon = last6.length >= 3 && last6.filter(s => !s.done).length >= 3;
    const hard = last6.filter(s => s.rating === "hard").length >= 2;
    const easy = last6.filter(s => s.rating === "easy").length >= 3;
    const delays = rows.map(s => s.delay).filter(x => typeof x === "number").sort((a, b) => a - b);
    const delay = delays.length >= 3 ? delays[Math.floor(delays.length / 2)] : null;
    // accuracy by time of day from the answer log (>= 10 answers per block)
    const byBlock = {};
    S.log.forEach(l => { const b = Engine.blockFor(new Date(l.t).getHours()); (byBlock[b] = byBlock[b] || [0, 0]); byBlock[b][0] += l.correct ? 1 : 0; byBlock[b][1]++; });
    const blocks = Object.keys(byBlock).filter(b => byBlock[b][1] >= 10).map(b => ({ b: +b, acc: byBlock[b][0] / byBlock[b][1], n: byBlock[b][1] }));
    blocks.sort((a, b) => b.acc - a.acc);
    const best = blocks.length >= 2 && blocks[0].acc - blocks[blocks.length - 1].acc >= 0.12 ? blocks[0] : null;
    // subjects that were planned but not done (last 14 days)
    const skipped = {};
    const pl = this.life().planLog;
    Object.keys(pl).filter(d => d < isoDay() && d >= isoDay(new Date(Date.now() - 14 * 864e5))).forEach(d => {
      pl[d].forEach(it => {
        if (!it.subjectId) return;
        const didIt = this.life().sessions.some(s => s.key === it.key && s.day === d && s.done);
        const e = skipped[it.subjectId] = skipped[it.subjectId] || [0, 0];
        e[1]++; if (!didIt) e[0]++;
      });
    });
    const avoided = Object.keys(skipped).filter(k => skipped[k][1] >= 3 && skipped[k][0] / skipped[k][1] >= 0.6);
    const studyDays = new Set(done.map(s => s.day)).size;
    return { n: rows.length, done: done.length, quit: rows.length - done.length, median, abandon, hard, easy, delay, best, avoided, studyDays };
  },

  /* energy for a time: own energy grid > learned best block > neutral */
  energyAt(minute) {
    const h = Math.floor(minute / 60);
    if (Object.keys(S.energy).length) return Engine.energyAt(h);
    const st = this.stats();
    if (st.best && Engine.blockFor(h) === st.best.b) return 4;
    return 3;
  },

  /* max minutes per unit today, from check-in, habits and observed behaviour */
  unitCap(date) {
    const l = this.life(), c = this.checkin(date), st = this.stats();
    let cap = clamp(+l.habits.prefLen || 25, 10, 60);
    const notes = [];
    if (st.abandon) { cap = Math.min(cap, 15); notes.push("co_adapt_abandon"); }
    if (st.hard) { cap = Math.min(cap, 20); notes.push("co_adapt_hard"); }
    if (c) {
      if (c.energy <= 2) { cap = Math.min(cap, 15); notes.push("co_adapt_energy"); }
      if (c.barrier === "overload") { cap = Math.min(cap, 15); notes.push("co_adapt_overload"); }
      if (c.barrier === "distraction") { cap = Math.min(cap, 20); notes.push("co_adapt_distraction"); }
    }
    return { cap: cap, notes: notes };
  },
  firstUnitCap(date) {
    const l = this.life(), c = this.checkin(date);
    if ((c && c.barrier === "start") || +l.habits.procrastination >= 4) return 10;
    return null;
  },

  /* minutes a topic still needs before a date (estimate, adjusted by readiness) */
  neededMinutes(topicId) {
    const r = S.progress[topicId];
    const ready = Readiness.topic(topicId);
    const base = r && r.attempts ? 90 : 120;
    return Math.round(base * (1 - ready));
  },

  /* -- candidates: everything that could be worked on today -- */
  candidates(date) {
    date = date || new Date();
    const l = this.life(), today = isoDay(date), out = [];
    const doneToday = key => l.sessions.some(s => s.key === key && s.day === today && s.done);
    const spentOn = prefix => sum(l.sessions.filter(s => s.day === today && s.key && s.key.indexOf(prefix) === 0).map(s => s.minutes));
    const goalBoost = sid => { const tg = +l.goals.subjectTargets[sid]; return tg >= 13 ? 1.15 : tg >= 10 ? 1.07 : 1; };
    const subjectOf = tid => { const s = S.subjects.find(x => x.topics.some(tp => tp.id === tid)); return s ? s.id : null; };
    const avoided = this.stats().avoided;

    // 1. exams and deadlines
    l.events.filter(e => !e.done && e.date >= today).forEach(e => {
      const days = daysUntil(e.date);
      if (days > 21) return;
      const topics = (e.topics && e.topics.length ? e.topics : []).filter(id => S.subjects.some(s => s.topics.some(tp => tp.id === id)));
      const w = EVENT_WEIGHT[e.type] || 1;
      if (days === 0) {
        out.push({ key: "ev-final:" + e.id, kind: "review", event: e, subjectId: e.subjectId, minutes: 10, score: 9,
          title: t("co_final_title", { title: e.title }), why: [t("co_why_today", { title: e.title })], tip: t("co_tip_final") });
        return;
      }
      if (e.type === "abgabe" || e.type === "gfs") {
        out.push({ key: "ev:" + e.id, kind: "external", event: e, subjectId: e.subjectId, minutes: 30, score: 4 + 3 * w / (days + 1),
          title: e.title, why: [t("co_why_due", { title: e.title, when: relDays(days) })] });
        return;
      }
      const list = topics.length ? topics : (S.subjects.find(s => s.id === e.subjectId) || { topics: [] }).topics.map(tp => tp.id);
      const need = list.map(id => ({ id: id, need: this.neededMinutes(id), ready: Readiness.topic(id) }))
        .filter(x => x.need > 5).sort((a, b) => a.ready - b.ready);
      const total = sum(need.map(x => x.need));
      if (!need.length) return;
      const studyDays = Math.max(1, days - (days > 1 ? 1 : 0));     // keep the last day for review
      const todayShare = days === 1 ? Math.min(total, 30) : Math.ceil(total / studyDays / 5) * 5;
      const share = clamp(todayShare, 15, 60);
      const left = Math.round(share - spentOn("ev:" + e.id + ":"));
      if (left < 5) return;                                   // today's share is done
      const practisedToday = id => l.sessions.some(s => s.day === today && s.done && s.key === "ev:" + e.id + ":" + id);
      const focus = need.find(x => !practisedToday(x.id)) || need[0];
      out.push({ key: "ev:" + e.id + ":" + focus.id, repeat: true, kind: hasContent(focus.id) ? "lesson" : "external", topicId: focus.id,
        event: e, subjectId: e.subjectId, minutes: Math.max(5, left),
        score: 5 + 4 * w / (days + 1),
        title: days === 1 ? t("co_eve_title", { topic: topicName(focus.id) }) : topicName(focus.id),
        why: [t("co_why_exam", { title: e.title, when: relDays(days) }), t("co_why_gap", { topic: topicName(focus.id), n: pct(focus.ready) }),
          t("co_why_need", { n: total, d: studyDays })],
        tip: days === 1 ? t("co_tip_eve") : null });
    });

    // 2. homework / own tasks
    l.tasks.filter(x => !x.done).forEach(x => {
      const days = x.due ? daysUntil(x.due) : 7;
      if (days > 10) return;
      out.push({ key: "task:" + x.id, kind: "task", task: x, subjectId: x.subjectId, minutes: clamp(+x.minutes || 20, 5, 120),
        score: days < 0 ? 7 : 3 + 3 / (Math.max(days, 0) + 1), title: x.title,
        why: [x.due ? t("co_why_task", { when: relDays(days) }) : t("co_why_task_nodue")] });
    });

    // 3. topics currently taught at school, 4. spaced review, 5. long-term Abitur plan
    const seen = new Set(out.map(c => c.topicId).filter(Boolean));
    S.subjects.forEach(s => s.topics.forEach(tp => {
      if (seen.has(tp.id) || l.curriculum[tp.id] === "done") return;
      const r = S.progress[tp.id];
      const fresh = Readiness.freshness(tp.id);
      const now = l.curriculum[tp.id] === "now";
      const pri = Engine.priority({ exam: tp.exam, mastery: Engine.rec(tp.id).mastery });
      let score = pri * goalBoost(s.id), why = [], kind = hasContent(tp.id) ? "lesson" : "external", minutes = null, title = tp.name;
      if (now) { score += 1.2; why.push(t("co_why_now")); }
      if (r && r.attempts && r.mastery > 0.3 && fresh < 0.7) {
        score += 0.9; why.push(t("co_why_review", { n: Readiness.daysSince(tp.id) })); minutes = 15;
        title = t("co_review_title", { topic: tp.name });
      }
      if (!why.length) why.push(t("co_why_abi", { n: pct(Engine.rec(tp.id).mastery) }));
      if (goalBoost(s.id) > 1) why.push(t("co_why_goal", { subject: s.name, p: l.goals.subjectTargets[s.id] }));
      if (avoided.indexOf(s.id) !== -1) why.push(t("co_why_avoided"));
      out.push({ key: "topic:" + tp.id, kind: kind, topicId: tp.id, subjectId: s.id, minutes: minutes, score: score, title: title, why: why });
    }));

    return out.filter(c => c.repeat || !doneToday(c.key)).sort((a, b) => b.score - a.score);
  },

  /* free minutes today: study windows minus timetable minus now */
  freeSlots(date) {
    const l = this.life(), day = weekday(date);
    const wins = l.windows.filter(w => w.enabled && w.day === day);
    let free = wins.map(w => [toMin(w.from), toMin(w.to)]).filter(x => x[1] > x[0]);
    l.timetable.filter(b => b.day === day).forEach(b => {
      const a = toMin(b.from), z = toMin(b.to);
      free = free.flatMap(([x, y]) => z <= x || a >= y ? [[x, y]] : [[x, Math.min(a, y)], [Math.max(z, x), y]].filter(q => q[1] - q[0] >= 5));
    });
    if (isoDay(date) === isoDay()) {
      const now = new Date(), m = Math.ceil((now.getHours() * 60 + now.getMinutes()) / 5) * 5;
      free = free.map(([x, y]) => [Math.max(x, m), y]).filter(q => q[1] - q[0] >= 5);
    }
    return free;
  },

  plan(date) {
    date = date || new Date();
    const l = this.life(), today = isoDay(date);
    const { cap, notes } = this.unitCap(date);
    const first = this.firstUnitCap(date);
    const st = this.stats();
    const spentToday = sum(l.sessions.filter(s => s.day === today).map(s => s.minutes));
    let budget = clamp(+l.budget || 60, 10, 480) - spentToday;
    const c = this.checkin(date);
    if (c && c.energy <= 2) budget = Math.min(budget, Math.round((+l.budget || 60) * 0.6));
    const cands = this.candidates(date);
    const items = [];
    const free = this.freeSlots(date);
    const timed = this.configured();

    for (const cand of cands) {
      if (items.length >= 6 || budget < 5) break;
      let mins = cand.minutes || (st.median && cand.kind === "lesson" ? Math.round(st.median / 5) * 5 : 25);
      const isFinal = cand.kind === "review" && cand.event;
      if (!isFinal) mins = Math.min(mins, cand.kind === "task" ? Math.max(cap, cand.minutes || 0) : cap);
      if (!items.length && first && !isFinal) mins = Math.min(mins, first);
      mins = clamp(Math.round(mins / 5) * 5, 5, 120);
      if (mins > budget) { if (budget >= 10 && items.length) mins = Math.floor(budget / 5) * 5; else continue; }
      const it = Object.assign({}, cand, { minutes: mins });
      if (timed) {
        const heavy = cand.kind === "lesson" || (cand.event && cand.kind !== "review");
        const slots = free.map((s, i) => ({ a: s[0], b: s[1], i: i, e: this.energyAt(s[0]) })).filter(s => s.b - s.a >= mins);
        if (!slots.length) continue;
        slots.sort((x, y) => heavy ? (y.e - x.e) || (x.a - y.a) : (x.a - y.a));
        const sl = slots[0];
        it.start = sl.a; it.end = sl.a + mins; it.energy = sl.e;
        free[sl.i][0] = sl.a + mins + (+l.breakMins || 10);
      }
      budget -= mins;
      items.push(it);
    }
    if (timed) items.sort((a, b) => a.start - b.start);
    // remember what was planned (for "planned but skipped" observations)
    if (today === isoDay() && items.length) {
      const snap = items.map(i => ({ key: i.key, subjectId: i.subjectId || null }));
      const prev = l.planLog[today] || [];
      snap.forEach(s => { if (!prev.some(p => p.key === s.key)) prev.push(s); });
      l.planLog[today] = prev.slice(0, 12);
      const keep = Object.keys(l.planLog).sort().slice(-30);
      Object.keys(l.planLog).forEach(k => { if (keep.indexOf(k) === -1) delete l.planLog[k]; });
    }
    return { items: items, notes: notes, timed: timed, budgetLeft: Math.max(0, budget), spent: Math.round(spentToday),
      pending: Math.max(0, cands.length - items.length) };
  },

  /* -- sessions -- */
  begin(item) {
    this.active = item ? { key: item.key, kind: item.kind, planned: item.minutes, start: item.start, topicId: item.topicId || null,
      subjectId: item.subjectId || null, ref: item.task ? item.task.id : item.event ? item.event.id : null, t0: Date.now() } : null;
  },
  record(extra) {
    const l = this.life(), a = this.active || {};
    const now = new Date();
    const row = Object.assign({
      id: uidL(), at: Date.now(), day: isoDay(now), hour: now.getHours(), key: a.key || null, kind: a.kind || "lesson",
      planned: a.planned || null, ref: a.ref || null, subjectId: a.subjectId || null, rating: null,
      delay: a.start != null && a.key ? Math.round((new Date(a.t0).getHours() * 60 + new Date(a.t0).getMinutes()) - a.start) : null
    }, extra);
    row.minutes = Math.max(0.5, Math.round((row.minutes || 0) * 10) / 10);
    l.sessions.push(row);
    if (l.sessions.length > 600) l.sessions = l.sessions.slice(-600);
    this.lastSession = row.id;
    this.active = null;
    Store.save();
    return row;
  }
};

    </div>
    <div class="focus-body"><div class="focus-card" style="text-align:center">
      <div class="micro-tag">${esc(f.title)}</div>
      <div class="focus-clock mono" id="fclock" role="timer" aria-live="off">--:--</div>
      <p class="lede" style="margin:10px auto 0">${hint}</p>
      ${f.tip ? `<p class="hint">${esc(f.tip)}</p>` : ""}
      ${+Coach.life().habits.phone >= 4 ? `<p class="hint">${t("co_phone_tip")}</p>` : ""}
      <div class="btn-row" style="justify-content:center">
        <button class="btn btn-ghost" data-act="focusToggle">${f.running ? t("co_pause") : t("co_resume")}</button>
        <button class="btn btn-primary" data-act="focusDone">${t("co_finish")}</button>
      </div>
    </div></div>`, "focus-screen");
  const tick = () => {
    const el = document.getElementById("fclock");
    if (!el || !FOCUS) { stopTick(); return; }
    const left = Math.max(0, Math.round(f.minutes * 60 - focusElapsed()));
    el.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
    if (left <= 0 && !f.rang) { f.rang = true; toast(`<span>◆</span><span>${esc(t("co_timeup"))}</span>`, 4000); }
  };
  tick();
  TICK = setInterval(tick, 1000);
}
ACT.focusToggle = () => {
  if (!FOCUS) return;
  if (FOCUS.running) { FOCUS.spent += (Date.now() - FOCUS.t0) / 1000; FOCUS.running = false; }
  else { FOCUS.t0 = Date.now(); FOCUS.running = true; }
  renderFocus();
};
ACT.focusQuit = () => {
  if (!FOCUS) return;
  const mins = focusElapsed() / 60;
  if (mins >= 0.5) Coach.record({ kind: FOCUS.kind, minutes: mins, done: false, topicId: FOCUS.topicId || null });
  else Coach.active = null;
  FOCUS = null; stopTick(); VIEW = "dash"; render();
};
ACT.focusDone = () => {
  if (!FOCUS) return;
  const f = FOCUS;
  const mins = focusElapsed() / 60;
  if (f.running) { f.spent += (Date.now() - f.t0) / 1000; f.running = false; }
  stopTick();
  const row = Coach.record({ kind: f.kind, minutes: mins, done: true, topicId: f.topicId || null });
  const l = Coach.life();
  if (f.kind === "task") {
    const tk = l.tasks.find(x => x.id === f.ref);
    if (tk) tk.spent = (tk.spent || 0) + Math.round(mins);
  }
  if (f.kind === "review" && f.event) { /* nothing else: exam is today */ }
  Store.save();
  FLOW.redraw = null;
  mount(`<div class="center-wrap"><div class="stage" style="text-align:center">
    <div style="font-size:34px;margin-bottom:8px">✓</div>
    <h1>${t("co_focus_done", { n: Math.max(1, Math.round(mins)) })}</h1>
    <p class="lede" style="margin:12px auto 0">${f.kind === "task" ? t("co_task_q") : t("co_recall")}</p>
    ${f.kind !== "task" ? `<textarea class="field" id="recall" rows="4" maxlength="2000" placeholder="${esc(t("co_recall_ph"))}" style="margin-top:18px;text-align:left"></textarea>` : ""}
    <div class="btn-row" style="justify-content:center">
      ${f.kind === "task" ? `<button class="btn btn-primary" data-act="focusTaskDone" data-v="${esc(f.ref)}">${t("co_task_done")}</button>
        <button class="btn btn-ghost" data-act="focusBack">${t("co_task_notyet")}</button>`
      : `<button class="btn btn-primary" data-act="focusSaveNote" data-v="${esc(row.id)}">${t("co_save_back")}</button>`}
    </div>
    ${ratingCard()}
    <p class="hint">${t("co_external_note")}</p>

  FOCUS = null;
};

function weekStrip() {
  const l = Coach.life(), names = dayNames(), out = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(Date.now() + i * 864e5), iso = isoDay(d), wd = weekday(d);
    const lessons = l.timetable.filter(b => b.day === wd).length;
    const win = l.windows.filter(w => w.day === wd && w.enabled).reduce((n, w) => n + Math.max(0, toMin(w.to) - toMin(w.from)), 0);
    const ev = l.events.filter(e => !e.done && e.date === iso);
    const tk = l.tasks.filter(x => !x.done && x.due === iso);
    out.push(`<div class="wk-day ${i === 0 ? "on" : ""}"><div class="wk-name">${esc(names[wd].slice(0, 2))} <span class="mute">${d.getDate()}.</span></div>
      ${ev.map(e => `<div class="wk-ev">${esc(t("co_type_" + e.type))}: ${esc(e.title)}</div>`).join("")}
      ${tk.map(x => `<div class="wk-tk">${esc(x.title)}</div>`).join("")}
      <div class="wk-meta">${lessons ? t("co_wk_lessons", { n: lessons }) : ""}${win ? `<br>${t("co_wk_free", { n: win })}` : ""}</div></div>`);
  }
  return `<div class="wk-strip" aria-label="${esc(t("co_week_ahead"))}">${out.join("")}</div>`;
}

    <div class="scale-ends"><span>${lo}</span><span>${hi}</span></div>`;
  return `<section class="card">
      <div class="sec-title">${t("co_goals")}</div>
      <div class="form-grid">
        ${field("g-avg", t("co_goal_avg"), `<input class="field" id="g-avg" maxlength="10" inputmode="decimal" placeholder="1,8" value="${esc(g.avg)}">`)}
        ${field("g-study", t("co_goal_study"), `<input class="field" id="g-study" maxlength="120" placeholder="${esc(t("co_goal_study_ph"))}" value="${esc(g.study)}">`)}
      </div>
      ${field("g-why", t("co_goal_why"), `<textarea class="field" id="g-why" rows="2" maxlength="400" placeholder="${esc(t("co_goal_why_ph"))}">${esc(g.why)}</textarea>`)}
      ${S.subjects.length ? `<div class="label">${t("co_goal_subjects")}</div>
      <div class="form-grid">${S.subjects.map(s => field("gt-" + s.id, esc(s.name) + " " + (s.tag ? `<span class="mute">${esc(s.tag)}</span>` : ""),
        `<input class="field" type="number" min="0" max="15" id="gt-${esc(s.id)}" data-sid="${esc(s.id)}" placeholder="${t("co_points")}" value="${esc(g.subjectTargets[s.id] == null ? "" : g.subjectTargets[s.id])}">`)).join("")}</div>
      <p class="hint">${t("co_goal_subjects_note")}</p>` : ""}
    </section>
    <section class="card" style="margin-top:16px">
      <div class="sec-title">${t("co_habits")}</div>
      <p class="hint">${t("co_habits_note")}</p>
      <div class="label" id="procrastination-l">${t("co_hab_proc")}</div>${scale("procrastination", h.procrastination, t("co_hab_proc_lo"), t("co_hab_proc_hi"))}
      <div class="label" id="phone-l">${t("co_hab_phone")}</div>${scale("phone", h.phone, t("co_hab_phone_lo"), t("co_hab_phone_hi"))}
      <div class="form-grid">
        ${field("h-len", t("co_hab_len"), `<select class="field" id="h-len">${[10, 15, 20, 25, 30, 45, 60].map(v => `<option value="${v}" ${+h.prefLen === v ? "selected" : ""}>${v} min</option>`).join("")}</select>`)}
        ${field("h-place", t("co_hab_place"), `<input class="field" id="h-place" maxlength="60" placeholder="${esc(t("co_place_default"))}" value="${esc(h.place)}">`)}
      </div>
      ${field("h-starter", t("co_hab_starter"), `<input class="field" id="h-starter" maxlength="120" placeholder="${esc(t("co_hab_starter_ph"))}" value="${esc(h.starter)}">`)}
      <div class="btn-row"><button class="btn btn-primary" data-act="aboutSave">${t("co_save")}</button></div>
    </section>`;
}
ACT.habScale = (el, d) => {
  Coach.life().habits[d.k] = +d.v;
  el.parentNode.querySelectorAll(".chip").forEach(c => { c.classList.toggle("sel", c === el); c.setAttribute("aria-pressed", String(c === el)); });
};
ACT.aboutSave = () => {
  const l = Coach.life();
  l.goals.avg = $("#g-avg").value.trim().slice(0, 10);
  l.goals.study = $("#g-study").value.trim().slice(0, 120);
  l.goals.why = $("#g-why").value.trim().slice(0, 400);
  document.querySelectorAll("input[data-sid]").forEach(inp => {
    const v = inp.value.trim();
    if (v === "") delete l.goals.subjectTargets[inp.dataset.sid];
    else if (+v >= 0 && +v <= 15) l.goals.subjectTargets[inp.dataset.sid] = Math.round(+v);
  });
  l.habits.prefLen = +$("#h-len").value;
  l.habits.place = $("#h-place").value.trim().slice(0, 60);
  l.habits.starter = $("#h-starter").value.trim().slice(0, 120);
  Store.save(); toast(`<span>✓</span><span>${esc(t("co_saved"))}</span>`);
  if (WIZ) wizNext(); else render();
};
function insightsCard() {
  const st = Coach.stats(), l = Coach.life(), lines = [];
  if (st.n) lines.push(t("co_ins_sessions", { a: st.done, b: st.quit, d: st.studyDays }));
  if (st.median != null) lines.push(t("co_ins_median", { n: Math.round(st.median) }));
  if (st.best) lines.push(t("co_ins_best", { h: hourLabel(st.best.b), n: pct(st.best.acc) }));
  if (st.delay != null && Math.abs(st.delay) >= 10) lines.push(t(st.delay > 0 ? "co_ins_late" : "co_ins_early", { n: Math.abs(Math.round(st.delay)) }));
  if (st.abandon) lines.push(t("co_ins_abandon"));
  if (st.hard) lines.push(t("co_ins_hard"));
  if (st.easy) lines.push(t("co_ins_easy"));
  st.avoided.forEach(sid => lines.push(t("co_ins_avoided", { s: subjectName(sid) })));
  return `<section class="card">
    <div class="sec-title">${t("co_insights")}</div>
    <p class="hint">${t("co_insights_note")}</p>
    ${lines.length ? `<ul class="coach-why">${lines.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="hint">${t("co_ins_empty")}</p>`}
    ${l.goals.why ? `<div class="card-2" style="margin-top:12px"><div class="sec-title" style="margin-bottom:6px">${t("co_your_why")}</div><p style="margin:0">${esc(l.goals.why)}</p></div>` : ""}
  </section>`;
}

/* ---------- Setup wizard ("Alltag einrichten") ----------------- */
let WIZ = null;
const WIZ_STEPS = ["about", "week", "events"];
function startWizard() { WIZ = { i: 0 }; renderWizard(); }
function renderWizard() {
  stopTick();
  FLOW.redraw = renderWizard;
  const step = WIZ_STEPS[WIZ.i];
  let body = "";
  if (step === "about") body = aboutForms();
  else if (step === "week") body = weekForms();
  else { PLAN_TAB = "events"; body = wizardEvents(); }
  mount(`<div class="center-wrap"><div class="stage" style="max-width:820px">
    <div class="eyebrow">${t("co_wiz_head")} · ${WIZ.i + 1} / ${WIZ_STEPS.length}</div>
    <h1 style="margin-top:10px">${t("co_wiz_" + step)}</h1>
    <p class="lede" style="margin:10px 0 20px">${t("co_wiz_" + step + "_t")}</p>
    ${body}
    <div class="btn-row">
      ${step === "events" ? `<button class="btn btn-primary" data-act="wizFinish">${t("co_wiz_finish")}</button>` : ""}
      <button class="btn btn-ghost" data-act="wizSkip">${step === "events" ? t("co_wiz_later") : t("co_wiz_skip")}</button>
    </div>
  </div></div>`);
}
function wizardEvents() {
  const l = Coach.life(), sid = S.subjects[0] ? S.subjects[0].id : "", today = isoDay();
  return `<section class="card">
    <div class="form-grid">
      ${field("ev-type", t("co_type"), `<select class="field" id="ev-type">${EVENT_TYPES.map(x => `<option value="${x}">${t("co_type_" + x)}</option>`).join("")}</select>`)}
      ${field("ev-subject", t("co_subject"), `<select class="field" id="ev-subject">${subjectOptions(sid)}</select>`)}
      ${field("ev-date", t("co_date"), `<input class="field" type="date" id="ev-date" min="${today}">`)}
      ${field("ev-title", t("co_title"), `<input class="field" id="ev-title" maxlength="120" placeholder="${esc(t("co_title_ph"))}">`)}
    </div>
    <div class="label">${t("co_event_topics")}</div>
    <div class="chips" id="ev-topics">${eventTopicChips(sid, [])}</div>
    <div class="btn-row"><button class="btn btn-ghost" data-act="evAddWiz">${t("co_add")}</button></div>
    ${l.events.filter(e => !e.done).map(e => `<div class="kv"><span class="kv-k">${esc(e.title)}</span><span class="kv-v">${esc(fmtDate(e.date))}</span></div>`).join("")}
  </section>`;
}
ACT.evAddWiz = () => { const n = Coach.life().events.length; ACT.evAdd(); if (Coach.life().events.length > n) renderWizard(); };
function wizNext() { WIZ.i++; if (WIZ.i >= WIZ_STEPS.length) return ACT.wizFinish(); renderWizard(); }
ACT.wizSkip = () => { if (WIZ.i >= WIZ_STEPS.length - 1) return ACT.wizFinish(); wizNext(); };
ACT.wizFinish = () => { WIZ = null; Coach.life().setupDone = true; Store.save(); FLOW = {}; VIEW = "dash"; render(); };
function setupPromptCard() {
  const l = Coach.life();
  if (l.setupDone || Coach.configured()) return "";
  return `<section class="card-2" style="margin-bottom:16px;border-color:var(--accent-line)">
    <div class="sec-title" style="margin-bottom:8px">${t("co_setup_title")}</div>
    <p class="dim" style="font-size:14px;line-height:1.6;margin:0">${t("co_setup_t")}</p>
    <div class="btn-row" style="margin-top:14px"><button class="btn btn-primary" data-act="coachSetup">${t("co_setup_btn")}</button></div>
  </section>`;
}

/* ---------- 7. BOOT --------------------------------------- */
function boot() {
  const had = Store.load();
  backfillLastPractice();
  loadAiCache();
  syncTopicCatalogue();
  if (S.lang && I18N[S.lang]) LANG = S.lang;
  else {
    const nav = (navigator.language || "de").slice(0, 2).toLowerCase();
    LANG = I18N[nav] ? nav : "de";
    S.lang = LANG;
  }
  document.documentElement.lang = LANG;
  const today = new Date().toDateString();
  if (S.lastActive && S.lastActive !== today) {
    const gap = Math.round((new Date(today) - new Date(S.lastActive)) / 864e5);
    S.streak = gap === 1 ? S.streak + 1 : 1;
    S.completedToday = [];
    S.lastActive = today;
    Store.save();
  } else if (!S.lastActive) { S.lastActive = today; Store.save(); }
  if (had && S.stage === "app") { VIEW = "dash"; render(); } else scrWelcome();
}
document.addEventListener("keydown", e => {
  const opts = document.querySelectorAll(".opt[data-act]");
  if (!opts.length) return;
  const i = "1234".indexOf(e.key) !== -1 ? "1234".indexOf(e.key)
          : "abcdABCD".indexOf(e.key) !== -1 ? "abcdABCD".indexOf(e.key) % 4 : -1;
  if (i >= 0 && opts[i]) opts[i].click();
});
/* ---------- 8. OFFLINE / INSTALLABLE APP ---------------- */
function registerServiceWorker() {
  if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* app works without it */ });
  });
}
window.addEventListener("offline", () => toast(`<span>○</span><span>${esc(t("off_now"))}</span>`, 4200));
window.addEventListener("online", () => toast(`<span>●</span><span>${esc(t("off_back"))}</span>`, 2200));

boot();
registerServiceWorker();

</script>
</body>
</html>
